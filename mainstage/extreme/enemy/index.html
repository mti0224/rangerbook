<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>極限模式敵人資訊｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../../assets/css/style.css">
  <link rel="stylesheet" href="../../../assets/css/ranger.css">
  <link rel="stylesheet" href="../../../assets/css/ranger-pagination.css">
  <link rel="stylesheet" href="../../../assets/css/hsEnemy.css">
  <link rel="stylesheet" href="../../../assets/css/card-tag-colors.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>極限模式敵人資訊</h1>
      <p>查詢極限模式關卡中敵人的詳細數據。</p>
    </section>

    <section class="controls ranger-controls">
      <label class="search-box">
        <span>搜尋敵人</span>
        <input id="enemySearchInput" type="search" placeholder="輸入敵人 ID、類型、屬性、技能或能力...">
      </label>
      <label><span>能力</span><select id="abilityFilter"><option value="">全部</option></select></label>
      <label><span>類型</span><select id="typeFilter"><option value="">全部</option></select></label>
      <label><span>屬性</span><select id="elementFilter"><option value="">全部</option></select></label>
      <button id="enemyResetBtn" type="button">清除篩選</button>
    </section>

    <section class="summary-bar"><div><strong id="enemyResultCount">0</strong><span>筆結果</span></div></section>
    <section class="ranger-list-layout"><div id="enemyList" class="ranger-list"></div></section>
  </main>

  <div id="enemyModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="enemyModalTitle">
      <button id="enemyModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="enemyModalContent"></div>
    </div>
  </div>

  <script src="../../../assets/js/site.js"></script>
  <script>
    (() => {
      const originalFetch = window.fetch.bind(window);

      function hasUsableAbility(value) {
        if (Array.isArray(value)) return value.some(hasUsableAbility);
        if (value && typeof value === 'object') return true;
        const text = String(value || '').trim();
        return Boolean(text && text !== '無' && text !== '(無)');
      }

      function mergeAwakenAbilities(enemy) {
        if (!enemy || typeof enemy !== 'object') return enemy;
        const awaken = Array.isArray(enemy['覺醒能力']) ? enemy['覺醒能力'].filter(hasUsableAbility) : [];
        if (!awaken.length) return enemy;

        const merged = [];
        const third = enemy['能力3'];
        if (Array.isArray(third)) merged.push(...third.filter(hasUsableAbility));
        else if (hasUsableAbility(third)) merged.push(third);
        merged.push(...awaken);

        return { ...enemy, '能力3': merged };
      }

      async function rewriteEnemyResponse(response) {
        if (!response || !response.ok) return response;
        try {
          const raw = await response.json();
          const data = Array.isArray(raw) ? raw.map(mergeAwakenAbilities) : raw;
          const headers = new Headers(response.headers);
          headers.set('content-type', 'application/json; charset=utf-8');
          return new Response(JSON.stringify(data), {
            status: response.status,
            statusText: response.statusText,
            headers
          });
        } catch (error) {
          console.warn('極限敵人覺醒能力轉換失敗：', error);
          return response;
        }
      }

      window.fetch = function (resource, options) {
        const url = String(resource);
        if (url.includes('../res/hsEnemy_data.json')) {
          return originalFetch('../../../res/extremeEnemy_data.json', options).then(rewriteEnemyResponse);
        }
        if (url.includes('../res/%E8%83%BD%E5%8A%9B.json')) {
          return originalFetch('../../../res/%E8%83%BD%E5%8A%9B.json', options);
        }
        return originalFetch(resource, options);
      };
    })();
  </script>
  <script src="../../../assets/js/hsEnemy.js"></script>
  <script src="../../../assets/js/hsEnemy-skill-meta-table.js"></script>
  <script src="../../../assets/js/card-tag-colors.js"></script>
  <script src="../../../assets/js/bottom-pagination.js"></script>
</body>
</html>
