<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>裝備｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ranger.css">
  <link rel="stylesheet" href="../assets/css/ranger-pagination.css">
  <link rel="stylesheet" href="../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../assets/css/gear.css">
  <link rel="stylesheet" href="../assets/css/gear-specplus.css">
  <link rel="stylesheet" href="../assets/css/gear-trigger-tags.css">
  <link rel="stylesheet" href="../assets/css/gear-page-mode.css">
  <link rel="stylesheet" href="../assets/css/gear-upgrade-levels.css">
  <link rel="stylesheet" href="../assets/css/gear-detail-scroll-fix.css">
  <link rel="stylesheet" href="../assets/css/gear-basic-display-level.css">
  <link rel="stylesheet" href="../assets/css/gear-detail-level-controls-only.css">
  <link rel="stylesheet" href="../assets/css/gear-advanced-divider-width.css">
  <link rel="stylesheet" href="../assets/css/gear-skillplus-ranger-filters.css?v=20260731-2">
</head>
<body>
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>裝備</h1>
      <p>查詢裝備的詳細數據。</p>
    </section>

    <section class="controls ranger-controls gear-controls">
      <div class="gear-basic-filter-row">
        <label class="search-box gear-search-box">
          <span>搜尋裝備</span>
          <input id="gearSearchInput" type="search" placeholder="輸入裝備名稱、種類、效果或數值...">
        </label>

        <button id="gearAdvancedToggleBtn" class="gear-advanced-toggle-btn" type="button" aria-expanded="false" aria-controls="gearAdvancedFilters">
          進階篩選 ▼
        </button>

        <button id="gearResetBtn" type="button">清除篩選</button>
      </div>

      <div id="gearAdvancedFilters" class="gear-advanced-filters" hidden>
        <section class="gear-filter-panel">
          <div class="gear-filter-head">
            <h2>星數</h2>
          </div>
          <div id="gearStarFilter" class="gear-checkbox-grid gear-star-grid"></div>
        </section>

        <section class="gear-filter-panel">
          <div class="gear-filter-head">
            <h2>類型</h2>
          </div>
          <div id="gearTypeFilter" class="gear-checkbox-grid gear-type-grid"></div>
        </section>

        <section class="gear-filter-panel gear-basic-filter-panel">
          <div class="gear-filter-head">
            <h2>基本效果</h2>
            <div class="gear-mode-switch" role="group" aria-label="基本效果篩選模式">
              <button id="gearBasicModeOr" class="active" type="button" data-mode="OR">OR</button>
              <button id="gearBasicModeAnd" type="button" data-mode="AND">AND</button>
            </div>
          </div>
          <div id="gearBasicEffectFilter" class="gear-checkbox-grid gear-basic-grid"></div>
        </section>

        <section class="gear-filter-panel gear-trigger-filter-panel">
          <div class="gear-filter-head">
            <h2>觸發條件</h2>
          </div>
          <div id="gearTriggerAttrFilter" class="gear-checkbox-grid gear-trigger-attr-grid"></div>
          <div id="gearTriggerTypeFilter" class="gear-checkbox-grid gear-trigger-type-grid"></div>
        </section>

        <section class="gear-filter-panel gear-basic-display-panel">
          <div class="gear-filter-head">
            <h2>基本數值顯示等級</h2>
          </div>
          <fieldset id="gearBasicDisplayLevel" class="gear-basic-display-level" aria-label="基本數值顯示等級">
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="0" checked><span>+0</span></label>
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="1"><span>+1</span></label>
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="2"><span>+2</span></label>
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="3"><span>+3</span></label>
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="4"><span>+4</span></label>
            <label class="gear-basic-display-option"><input type="radio" name="gearBasicDisplayLevel" value="5"><span>+Max</span></label>
          </fieldset>
        </section>
      </div>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="gearResultCount">0</strong>
        <span>筆結果</span>
      </div>
    </section>

    <section class="ranger-list-layout">
      <div id="gearList" class="ranger-list gear-list"></div>
    </section>
  </main>

  <div id="gearModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="gearModalTitle">
      <button id="gearModalCloseBtn" class="modal-close" type="button" aria-label="關閉裝備詳細資料">×</button>
      <div id="gearModalContent"></div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-auth-compat.js"></script>
  <script>
    RangerbookAdminCompat.loadScripts([
      "../assets/js/gear-detail.js",
      "../assets/js/gear.js",
      "../assets/js/card-tag-colors.js",
      "../assets/js/gear-detail-scroll-guard.js",
      "../assets/js/gear-page-mode.js",
      "../assets/js/bottom-pagination.js"
    ]).catch(console.error);
  </script>
</body>
</html>
