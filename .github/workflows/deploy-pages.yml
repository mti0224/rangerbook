name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reuse original public Ranger sprites
        uses: actions/cache@v4
        with:
          path: .portrait-source
          key: native-portrait-sprites-v1-${{ hashFiles('res/v2/projectiles.json') }}
          restore-keys: native-portrait-sprites-v1-

      - name: Build native portrait PNGs
        run: |
          python -m pip install 'Pillow>=11,<14'
          python scripts/build-ranger-portraits.py
          python -m unittest discover -s tests -p 'test_ranger_portraits.py'

      - name: Package compatible PWA application and data releases
        run: node scripts/build-pwa.mjs

      - name: Stage public website files only
        run: node scripts/package-pages.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          reporting_interval: 10000
