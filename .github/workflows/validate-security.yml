name: Validate security boundaries
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'membership/**'
      - 'login/**'
      - 'register/**'
      - 'two-factor/**'
      - 'forgot-password/**'
      - 'assets/css/member.css'
      - 'assets/js/site.js'
      - 'account/**'
      - 'account-action/**'
      - 'personal-teams/**'
      - 'assets/js/member-*.js'
      - 'tests/member-*'
      - 'tests/test_membership*.py'
      - 'assets/pwa/service-worker.js'
      - 'assets/css/admin.css'
      - 'assets/css/sidebar-drawer.css'
      - 'ops/**'
      - 'deploy/**'
      - 'res/resource_asset_manifest.json'
      - 'scripts/check-public-boundary.mjs'
      - 'assets/js/admin-*.js'
      - 'assets/locales/sitewide-overrides.json'
      - 'scripts/package-pages.mjs'
      - 'tests/security-*'
      - '.github/workflows/validate-security.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r membership/requirements.txt fastapi requests argon2-cffi pytest httpx
      - run: python -m pytest -q tests/test_backend_logs.py tests/test_job_runs.py tests/test_admin_directory.py tests/test_membership_core.py tests/test_membership_production.py tests/test_membership_mail.py
      - run: node scripts/build-pwa.mjs
      - run: node scripts/check-public-boundary.mjs
      - run: node tests/security-pages.mjs && node tests/security-auth.cjs
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Security and member browser flows
        run: |
          mkdir -p "$RUNNER_TEMP/member-ui"
          node tests/security-browser.cjs
          node tests/admin-account-directory.cjs
          QA_SCREENSHOTS="$RUNNER_TEMP/member-ui" node tests/member-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-ui-review
          path: ${{ runner.temp }}/member-ui
          if-no-files-found: ignore
      - name: Verify isolated acceptance artifact
        run: |
          node membership/stage/build-site.mjs "$RUNNER_TEMP/rangerbook-acceptance"
          node tests/member-stage-browser.cjs "$RUNNER_TEMP/rangerbook-acceptance"

  backend-logs-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Backend log viewer role and display checks
        run: |
          mkdir -p "$RUNNER_TEMP/backend-logs-ui"
          QA_LOCAL_FILES=1 QA_SCREENSHOTS="$RUNNER_TEMP/backend-logs-ui" node tests/admin-backend-logs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-logs-ui-review
          path: ${{ runner.temp }}/backend-logs-ui
          if-no-files-found: ignore
