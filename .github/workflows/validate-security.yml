name: Validate security boundaries
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'ops/**'
      - 'deploy/**'
      - 'res/resource_asset_manifest.json'
      - 'scripts/check-public-boundary.mjs'
      - 'assets/js/admin-*.js'
      - 'assets/locales/sitewide-overrides.json'
      - 'scripts/package-pages.mjs'
      - 'tests/security-*'
      - '.github/workflows/validate-security.yml'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-boundary.mjs
      - run: node tests/security-pages.mjs && node tests/security-auth.cjs
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/security-browser.cjs
