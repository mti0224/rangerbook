name: Validate localization
on:
  pull_request:
    paths:
      - "settings/**"
      - "assets/js/settings.js"
      - "assets/css/settings-page.css"
      - "assets/js/i18n.js"
      - "assets/js/v2-data.js"
      - "tests/sitewide-localization.cjs"
      - "assets/js/ranger-evolution.js"
      - "assets/data/ranger-evolution.json"
      - "tests/ranger-evolution.cjs"
      - "tests/test_sitewide_locale_coverage.py"
      - "assets/locales/**"
      - "deploy/aws/v2/locales/ui.json"
      - ".github/workflows/validate-locales.yml"
      - "tests/test_ui_locale_coverage.py"
      - "tests/test_i18n_detail_tables.py"
      - "assets/js/gear-detail.js"
      - "assets/js/ranger-compare.js"
      - "assets/js/hsEnemy.js"
      - "res/i18n/**"
      - "scripts/export_game_locales.py"
      - "tests/i18n-contract.cjs"
      - "tests/test_game_locale_export.py"
      - "assets/js/site.js"
      - "index.html"
      - "ranger/ranger/index.html"
      - "gear/index.html"
      - "ability/index.html"
      - "assets/js/gear.js"
      - "assets/js/ability.js"
      - "assets/js/ranger.js"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preview authored V2 UI catalog in the isolated checkout
        run: cp deploy/aws/v2/locales/ui.json res/v2/locales/ui.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -p 'test_game_locale_export.py' -v
      - run: python -m unittest discover -s tests -p 'test_ui_locale_coverage.py' -v
      - run: python -m unittest discover -s tests -p 'test_i18n_detail_tables.py' -v
      - run: python -m unittest discover -s tests -p 'test_user_audit_translations.py' -v
      - run: python -m unittest discover -s tests -p 'test_sitewide_locale_coverage.py' -v
      - run: node --check assets/js/i18n.js && node --check assets/js/site.js && node --check assets/js/ranger.js && node --check assets/js/gear.js && node --check assets/js/ability.js && node --check assets/js/settings.js
      - run: node tests/ranger-evolution.cjs
      - run: node tests/i18n-contract.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/sitewide-localization.cjs

