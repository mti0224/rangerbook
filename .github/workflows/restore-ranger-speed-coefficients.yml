name: Restore Ranger speed coefficients

on:
  push:
    branches: [restore-ranger-speed-coefficients]
    paths:
      - ".github/workflows/restore-ranger-speed-coefficients.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore speed coefficients from previous Ranger data
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          OLD_REF = "db7341a14e460e2ab83870700506f160590faeeb"
          DATA_PATH = Path("res/Rangers_data.json")

          current = json.loads(DATA_PATH.read_text(encoding="utf-8"))
          old_text = subprocess.check_output(
              ["git", "show", f"{OLD_REF}:res/Rangers_data.json"],
              text=True,
              encoding="utf-8",
          )
          old = json.loads(old_text)
          old_by_id = {str(row.get("ranger_id", "")): row for row in old}

          def label_only(value):
              return re.split(r"[（(]", str(value or ""), maxsplit=1)[0].strip()

          def suffix(value):
              match = re.search(r"[（(]([^）)]+)[）)]", str(value or ""))
              return match.group(1).strip() if match else ""

          restored_move = 0
          restored_attack = 0
          missing = []

          for row in current:
              rid = str(row.get("ranger_id", ""))
              previous = old_by_id.get(rid)
              if not previous:
                  missing.append(rid)
                  continue

              move_suffix = suffix(previous.get("移動速度"))
              if move_suffix:
                  row["移動速度"] = f"{label_only(row.get('移動速度'))}（{move_suffix}）"
                  restored_move += 1

              attack_suffix = suffix(previous.get("攻擊速度")).replace("/下", "")
              if attack_suffix:
                  row["攻擊速度"] = f"{label_only(row.get('攻擊速度'))}（{attack_suffix}）"
                  restored_attack += 1

          DATA_PATH.write_text(
              json.dumps(current, ensure_ascii=False, indent=4) + "\n",
              encoding="utf-8",
          )

          print(f"restored movement speed: {restored_move}")
          print(f"restored attack speed: {restored_attack}")
          print(f"missing previous rows: {len(missing)}")
          if missing:
              print("missing ids:", ", ".join(missing[:50]))
          PY

      - name: Commit restored data
        run: |
          if git diff --quiet -- res/Rangers_data.json; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/Rangers_data.json
          git commit -m "恢復Ranger移動與攻擊速度係數"
          git push
