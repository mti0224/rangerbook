name: Validate Auth Email Recovery

on:
  pull_request:
    paths:
      - "backend/rangerbook_auth/**"
      - "admin/index.html"
      - "assets/js/admin-auth.js"
      - "assets/js/admin-page.js"
      - "assets/js/admin-email.js"
      - "tests/test_auth_email_recovery.py"
      - ".github/workflows/validate-auth-email.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Auth test dependencies
        run: python -m pip install -r backend/rangerbook_auth/requirements.txt httpx
      - name: Test password recovery and email verification
        run: python tests/test_auth_email_recovery.py -v
      - name: JavaScript syntax checks
        run: |
          node --check assets/js/admin-email.js
          node --check assets/js/admin-auth.js
          node --check assets/js/admin-page.js
