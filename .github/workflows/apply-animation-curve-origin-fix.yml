name: Apply animation curve and origin fix

on:
  push:
    branches:
      - fix/animation-curve-origin-distance-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/animation-curve-origin-distance-20260805

      - name: Patch viewer and projectile metadata integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          viewer_path = Path('assets/js/ranger-animation-viewer.js')
          viewer = viewer_path.read_text(encoding='utf-8')
          viewer = replace_once(
              viewer,
              '  const TARGET_DISTANCE_MULTIPLIER = 1.5;',
              '  const TARGET_DISTANCE_MULTIPLIER = 2.25;',
              'target distance multiplier',
          )
          viewer = replace_once(
              viewer,
              '    if (configuredEnabled !== true && !["DIRECT", "SPECIAL"].includes(motionType)) renderMode = "LEGACY";',
              '    if (configuredEnabled === false && !["DIRECT", "SPECIAL"].includes(motionType)) renderMode = "LEGACY";',
              'legacy motion compatibility',
          )
          viewer = replace_once(
              viewer,
              '      if (renderMode === "CURVE") {',
              '      if (projectile.motionType === "CURVE") {',
              'curve path selection',
          )
          viewer = replace_once(
              viewer,
              '          <p class="ranger-animation-hint">一般關卡場景比例 0.85；角色與目標距離已增加 50%，縮放時目標可能移出畫面。</p>',
              '          <p class="ranger-animation-hint">一般關卡場景比例 0.85；角色與目標距離在目前基礎上再增加 50%，目標可移出畫面。</p>',
              'viewer hint',
          )
          viewer_path.write_text(viewer, encoding='utf-8')

          integration_path = Path('assets/js/ranger-animation-projectile-data.js')
          integration = integration_path.read_text(encoding='utf-8')
          integration = replace_once(
              integration,
              '    const dy = Math.abs(y - reference.y);',
              '    // UnitData uses positive-up Y; SAM animation-local coordinates use positive-down Y.\n    const samY = -y;\n    const dy = Math.abs(samY - reference.y);',
              'projectile start validation Y axis',
          )
          integration = replace_once(
              integration,
              '    const marker = createMarker(bodyPart, x, y, markerId);',
              '    const marker = createMarker(bodyPart, x, -y, markerId);',
              'projectile marker Y axis',
          )
          integration_path.write_text(integration, encoding='utf-8')
          PY

      - name: Validate JavaScript and geometry invariants
        run: |
          node --check assets/js/ranger-animation-viewer.js
          node --check assets/js/ranger-animation-projectile-data.js
          python3 - <<'PY'
          from pathlib import Path

          viewer = Path('assets/js/ranger-animation-viewer.js').read_text(encoding='utf-8')
          integration = Path('assets/js/ranger-animation-projectile-data.js').read_text(encoding='utf-8')

          assert 'const TARGET_DISTANCE_MULTIPLIER = 2.25;' in viewer
          assert 'configuredEnabled === false' in viewer
          assert 'if (projectile.motionType === "CURVE") {' in viewer
          assert 'if (renderMode === "CURVE") {' not in viewer
          assert 'const samY = -y;' in integration
          assert 'createMarker(bodyPart, x, -y, markerId)' in integration

          width = 640
          actor_x = width * 0.50
          original_gap = width * (0.90 - 0.50)
          previous_gap = original_gap * 1.5
          new_gap = original_gap * 2.25
          target_x = actor_x + new_gap
          assert new_gap == previous_gap * 1.5
          assert target_x == 896.0
          assert target_x > width
          PY

      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/js/ranger-animation-viewer.js assets/js/ranger-animation-projectile-data.js
          git rm -- .github/workflows/apply-animation-curve-origin-fix.yml
          git commit -m '修正投射物曲線與起始座標'
          git push origin HEAD:fix/animation-curve-origin-distance-20260805
