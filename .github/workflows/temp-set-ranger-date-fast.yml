name: Temporary fast Ranger date update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-set-ranger-date-fast.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            res/Rangers_data.json
          sparse-checkout-cone-mode: false

      - name: Update Ranger release dates
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          # Re-apply after the scheduled data refresh.
          p = Path('res/Rangers_data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          changed = []
          for r in data:
              m = re.match(r'^u(\d{4})', str(r.get('ranger_id', '')))
              if m and 1626 <= int(m.group(1)) <= 1631 and r.get('登場時間') == '未知':
                  r['登場時間'] = '2026/08/31'
                  changed.append(r['ranger_id'])
          p.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          print('Updated:', ', '.join(changed))
          if not changed:
              raise SystemExit('Nothing to update')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/Rangers_data.json
          git commit -m "fix(data): set 2026-08-31 release date for new Rangers"
          git push
