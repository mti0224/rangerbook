name: Validate loading performance
on:
  pull_request:
    paths:
      - 'assets/js/v2-data.js'
      - 'assets/js/pwa-data.js'
      - 'assets/js/ranger*.js'
      - 'assets/pwa/service-worker.js'
      - 'scripts/build-*.mjs'
      - 'tests/fast-data.cjs'
      - 'tests/loading-performance.cjs'
      - 'tests/talent-adapter.cjs'
      - 'tests/ranger-multiselect.cjs'
      - 'tests/filter-style-consistency.cjs'
      - 'assets/js/gear.js'
      - 'assets/js/gear-detail.js'
      - 'tests/gear-detail-loading.cjs'
      - 'tests/gear-spec-upgrades.cjs'
      - 'assets/css/gear.css'
      - 'gear/index.html'
      - 'assets/css/ranger-advanced-filters.css'
      - 'ranger/ranger/index.html'
      - '.github/workflows/validate-loading.yml'
jobs:
  loading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-pwa.mjs
      - run: node tests/gear-detail-loading.cjs && node tests/gear-spec-upgrades.cjs
      - run: node tests/fast-data.cjs && node tests/talent-adapter.cjs && node tests/pwa-contract.cjs && node tests/pwa-worker.cjs
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/loading-performance.cjs
      - run: node tests/ranger-multiselect.cjs
      - run: node tests/filter-style-consistency.cjs
