name: Validate Ranger page

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "assets/js/ranger.js"
      - "assets/js/ranger-animation-viewer.js"
      - "assets/js/ranger-animation-projectile-data.js"
      - "assets/js/ranger-animation-projectile-engine.js"
      - "assets/js/ranger-animation-projectile-engine-adapter.js"
      - "assets/js/ranger-animation-projectile-shadow.js"
      - "assets/js/ranger-animation-projectile-double-shadow.js"
      - "assets/js/ranger-animation-projectile-authority.js"
      - "assets/js/ranger-animation-projectile-double-authority.js"
      - "assets/js/ranger-animation-simulation-bridge.js"
      - "assets/js/ranger-animation-hit-effect-timing.js"
      - "assets/js/ranger-animation-debug-overlay.js"
      - "assets/js/ranger-animation-target.js"
      - "assets/js/ranger-animation-hit-effect.js"
      - "assets/hit_effect/**"
      - "tests/ranger-animation-projectile-*.test.js"
      - "tests/ranger-animation-simulation-bridge.test.js"
      - "tests/ranger-animation-hit-effect-timing.test.js"
      - "ranger/ranger/index.html"
      - "ranger/ranking/index.html"
      - ".github/workflows/validate-ranger-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/js/ranger.js
          node --check assets/js/ranger-animation-viewer.js
          node --check assets/js/ranger-animation-projectile-data.js
          node --check assets/js/ranger-animation-projectile-engine.js
          node --check assets/js/ranger-animation-projectile-engine-adapter.js
          node --check assets/js/ranger-animation-projectile-shadow.js
          node --check assets/js/ranger-animation-projectile-double-shadow.js
          node --check assets/js/ranger-animation-projectile-authority.js
          node --check assets/js/ranger-animation-projectile-double-authority.js
          node --check assets/js/ranger-animation-simulation-bridge.js
          node --check assets/js/ranger-animation-hit-effect-timing.js
          node --check assets/js/ranger-animation-debug-overlay.js
          node --check assets/js/ranger-animation-target.js
          node --check assets/js/ranger-animation-hit-effect.js
      - name: Validate projectile engine regressions
        run: |
          node --test tests/ranger-animation-projectile-*.test.js
          node --test tests/ranger-animation-simulation-bridge.test.js tests/ranger-animation-hit-effect-timing.test.js
      - name: Validate hit effect assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = Path("assets/hit_effect")
          data = json.loads((base / "eff_hit_strong_pretty.json").read_text(encoding="utf-8"))
          animation = data["animations"]["_all"]
          basic = next(segment for segment in data["segments"] if segment["name"] == "basic")
          assert basic["start"] == 0
          assert 0 < basic["end"] <= animation["frame_count"]
          expected = {
              "eff_hit_strong_118x116.png",
              "eff_hit_strong_30x44.png",
              "eff_hit_strong_90x44.png",
          }
          names = {image["name"] for image in data["images"]}
          assert expected <= names
          for name in expected:
              assert (base / name).is_file(), name
          PY
      - name: Validate Ranger script references
        run: |
          grep -q 'assets/js/site.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-data.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-engine.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-engine-adapter.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-shadow.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-double-shadow.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-authority.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-projectile-double-authority.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-simulation-bridge.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-hit-effect-timing.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-debug-overlay.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-target.js' ranger/ranger/index.html
          grep -q 'assets/js/ranger-animation-hit-effect.js' ranger/ranger/index.html
          ! grep -Eq 'ranger-(animation-gate|recovery|grouped-detail-items|level-slider|advanced-filters|animation-viewer-loader|page-mode)\.js|card-tag-colors\.js|bottom-pagination\.js' ranger/ranger/index.html
      - name: Validate Ranking script references
        run: |
          grep -q 'assets/js/ranger-animation-projectile-engine.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-projectile-engine-adapter.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-projectile-shadow.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-projectile-double-shadow.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-projectile-authority.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-projectile-double-authority.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-simulation-bridge.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-hit-effect-timing.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-debug-overlay.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-viewer.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-target.js' ranger/ranking/index.html
          grep -q 'assets/js/ranger-animation-hit-effect.js' ranger/ranking/index.html
