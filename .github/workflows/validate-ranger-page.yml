name: Validate Ranger page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check assets/js/ranger-page-mode.js && node --check assets/js/card-tag-colors.js && node --check assets/js/ranger-level-slider.js
