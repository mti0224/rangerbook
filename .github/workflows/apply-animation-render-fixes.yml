name: Apply animation render fixes

on:
  pull_request:
    paths:
      - "tools/temporary_apply_animation_render_fixes.py"
      - ".github/workflows/apply-animation-render-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/animation-render-cases-20260806
          fetch-depth: 0
      - name: Apply fixes
        run: python3 tools/temporary_apply_animation_render_fixes.py
      - name: Validate JavaScript and implementation markers
        run: |
          node --check assets/js/ranger-animation-viewer.js
          node --check assets/js/ranger-animation-target.js
          node --check assets/js/ranger-animation-hit-effect.js
          grep -q 'AUTHORED_FINISH' assets/js/ranger-animation-viewer.js
          grep -q 'state.referenceGeometry' assets/js/ranger-animation-target.js
          grep -q 'target?.targetTopY' assets/js/ranger-animation-hit-effect.js
      - name: Remove temporary inspection files
        run: |
          rm -f tools/temporary_apply_animation_render_fixes.py
          rm -f .github/workflows/inspect-animation-cases.yml
          rm -f .github/workflows/apply-animation-render-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ranger-animation-viewer.js \
                  assets/js/ranger-animation-target.js \
                  assets/js/ranger-animation-hit-effect.js \
                  tools/temporary_apply_animation_render_fixes.py \
                  .github/workflows/inspect-animation-cases.yml \
                  .github/workflows/apply-animation-render-fixes.yml
          git commit -m "fix: align authored attacks and target rendering"
          git push origin HEAD:fix/animation-render-cases-20260806
