name: One-time CODE GEASS release date patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run one-time CODE GEASS release-date patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Patch Ranger release dates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('res/Rangers_data.json')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          target = 'ab701_team_2610'
          matched = 0
          changed = 0
          in_top = False
          start = -1

          for i, line in enumerate(lines):
              bare = line.rstrip('\r\n')
              if not in_top and bare == '    {':
                  in_top = True
                  start = i
                  continue
              if in_top and bare in ('    },', '    }'):
                  block = ''.join(lines[start:i + 1])
                  if f'"abilityCode": "{target}"' in block or f'"abilityCode2": "{target}"' in block:
                      matched += 1
                      for j in range(start, i + 1):
                          m = re.match(r'^(\s*"登場時間":\s*)"[^"]+"(,?)(\r?\n?)$', lines[j])
                          if m:
                              lines[j] = f'{m.group(1)}"2026/9/30"{m.group(2)}{m.group(3)}'
                              changed += 1
                              break
                  in_top = False
                  start = -1

          if matched != 19 or changed != 19:
              raise SystemExit(f'safety check failed: matched={matched}, changed={changed}')

          path.write_text(''.join(lines), encoding='utf-8')
          print(f'patched {changed} CODE GEASS ranger records')
          PY

      - name: Commit data change and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'RangerBook one-time updater'
          git config user.email 'rangerbook-bot@users.noreply.github.com'
          git rm .github/workflows/update-code-geass-release.yml
          git add res/Rangers_data.json
          git commit -m 'fix(data): set CODE GEASS ranger release date to 2026/9/30'
          git push origin HEAD:main
