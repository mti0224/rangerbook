name: Audit Game-Tech visuals

on:
  pull_request:
    paths:
      - "assets/css/**"
      - "assets/js/site.js"
      - "**/*.html"
      - "tests/game-tech-contract.test.js"
      - "tests/first-paint.cjs"
      - "tests/pvp-history-chip-colors.cjs"
      - "tests/sitewide-visual-audit.cjs"
      - "backend/rangerbook_auth/**"
      - ".github/workflows/audit-game-tech-visuals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install audit browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/rangerbook-preview.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rangerbook-preview.log
          exit 1
      - name: Validate Google WIF setup and GA4 collector syntax
        run: |
          bash -n backend/rangerbook_auth/setup_google_wif.sh
          python3 -m py_compile backend/rangerbook_auth/traffic_collector.py
      - name: Render public pages in dark/light desktop/mobile
        run: node tests/sitewide-visual-audit.cjs
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
      - name: Check PvP chip series colors in light and dark modes
        run: node tests/pvp-history-chip-colors.cjs
      - name: Confirm no legacy first paint while site.js is delayed
        run: node tests/first-paint.cjs
      - name: Check admin tab layout with mocked permissions
        run: node tests/admin-workspace-ui.cjs
      - name: Save screenshots and issue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rangerbook-sitewide-visual-audit
          path: artifacts/visual-audit/
          retention-days: 10
