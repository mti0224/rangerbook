name: Apply no-projectile hit effect center fix

on:
  push:
    branches:
      - fix/no-projectile-hit-effect-center-20260806
    paths:
      - ".github/workflows/apply-no-projectile-hit-effect-center.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-projectile-hit-effect-center-20260806
      - name: Apply fix
        run: python3 .github/scripts/patch_no_projectile_hit_effect.py
      - name: Validate JavaScript and implementation markers
        run: |
          node --check assets/js/ranger-animation-hit-effect.js
          grep -q 'hasProjectile:Boolean(attackSegment.projectile)' assets/js/ranger-animation-hit-effect.js
          grep -q 'centeredOnTarget=!state.plan.hasProjectile' assets/js/ranger-animation-hit-effect.js
          grep -q 'loadEffectOriginOffset' assets/js/ranger-animation-hit-effect.js
      - name: Remove temporary files
        run: |
          rm .github/scripts/patch_no_projectile_hit_effect.py
          rm .github/workflows/apply-no-projectile-hit-effect-center.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/js/ranger-animation-hit-effect.js
          git rm --cached --ignore-unmatch .github/scripts/patch_no_projectile_hit_effect.py .github/workflows/apply-no-projectile-hit-effect-center.yml || true
          git add -u -- .github/scripts/patch_no_projectile_hit_effect.py .github/workflows/apply-no-projectile-hit-effect-center.yml
          git commit -m "fix: center no-projectile hit effect on target"
          git push origin HEAD:fix/no-projectile-hit-effect-center-20260806
