name: Apply projectile height and origin fix

on:
  push:
    branches:
      - fix/projectile-height-origin-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/projectile-height-origin-20260805
          fetch-depth: 0

      - name: Apply asserted replacements
        run: python .github/scripts/apply_projectile_height_origin_fix.py

      - name: Validate JavaScript and trajectory invariants
        run: |
          node --check assets/js/ranger-animation-viewer.js
          python - <<'PY'
          from pathlib import Path
          text = Path('assets/js/ranger-animation-viewer.js').read_text()
          assert 'function animationMarkerMuzzle' in text
          assert 'source: "animation-anchor"' in text
          assert '&& (rawX !== 0 || rawY !== 0)' in text
          assert 'function resolveOutboundEnd' in text
          assert 'start.y - projectile.endOffset.y * sceneScale' in text
          assert 'targetHeight * projectile.hitPointRate' not in text
          assert text.count('resolveOutboundEnd(projectile, layout, sceneScale, start)') == 3
          PY

      - name: Commit generated fix and remove temporary files
        run: |
          rm .github/workflows/apply-projectile-height-origin-fix.yml
          rm .github/scripts/apply_projectile_height_origin_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ranger-animation-viewer.js .github/workflows/apply-projectile-height-origin-fix.yml .github/scripts/apply_projectile_height_origin_fix.py
          git commit -m "fix: align projectile launch and impact heights"
          git push origin HEAD:fix/projectile-height-origin-20260805
