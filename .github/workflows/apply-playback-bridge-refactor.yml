name: Apply projectile playback bridge refactor

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'fix/native-curve-projectile-geometry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refactor actor grounding and playback timing
        shell: bash
        run: |
          cat > assets/js/ranger-animation-ground-endpoint-fix.js <<'JS'
          (() => {
            const upstreamFetch = window.fetch.bind(window);
            const animationMetaPattern = /\/animation_meta\/([^/?#]+)\.json(?:[?#]|$)/i;

            const STANDARD_ATTACK_SLOTS = [
              {
                key: "normal",
                defaultPart: "bul",
                bodyAnimations: [
                  "attack_all", "attack", "attack_a", "attack_b", "attack_ready", "idle", "wait",
                ],
              },
              {
                key: "skill1",
                defaultPart: "bul2",
                bodyAnimations: [
                  "s_attack_all", "s_action_attack_all", "s_attack", "s_attack_a", "s_attack_b",
                  "s_action_attack_2", "s_action_attack_3", "s_attack_ready", "s_action_attack_1",
                  "idle", "wait",
                ],
              },
              {
                key: "skill2",
                defaultPart: "bul3",
                bodyAnimations: [
                  "s2_attack_all", "s2_attack", "s2_attack_a", "s2_attack_b", "s2_attack_ready",
                  "skill", "idle", "wait",
                ],
              },
            ];

            function median(values) {
              const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
              if (!sorted.length) return NaN;
              const middle = Math.floor(sorted.length / 2);
              return sorted.length % 2
                ? sorted[middle]
                : (sorted[middle - 1] + sorted[middle]) * 0.5;
            }

            function findAnimation(part, names) {
              for (const name of names || []) {
                const animation = part?.animations?.[name];
                if (animation?.frames?.length) return animation;
              }
              return null;
            }

            function frameVisibleBounds(part, frame) {
              let minX = Infinity;
              let minY = Infinity;
              let maxX = -Infinity;
              let maxY = -Infinity;
              let visibleItems = 0;

              for (const item of frame || []) {
                const [, resourceNumber, objectMatrix, color] = item || [];
                const alpha = Array.isArray(color) ? Number(color[3] ?? 255) : 255;
                const imageDefinition = part?.images?.[resourceNumber];
                const sprite = part?.sprites?.[imageDefinition?.name];
                const width = Number(sprite?.rect?.[2]);
                const height = Number(sprite?.rect?.[3]);
                if (
                  alpha === 0 || !width || !height ||
                  !Array.isArray(objectMatrix) || !Array.isArray(imageDefinition?.m)
                ) continue;

                const [m00, m01, m10, m11, m02, m12] = objectMatrix;
                const [i00, i01, i10, i11, i02, i12] = imageDefinition.m;
                const f00 = m00 * i00 + m01 * i10;
                const f01 = m00 * i01 + m01 * i11;
                const f10 = m10 * i00 + m11 * i10;
                const f11 = m10 * i01 + m11 * i11;
                const tx = m00 * i02 + m01 * i12 + m02;
                const ty = m10 * i02 + m11 * i12 + m12;

                for (const [x, y] of [[0, 0], [width, 0], [0, height], [width, height]]) {
                  const worldX = f00 * x + f01 * y + tx;
                  const worldY = f10 * x + f11 * y + ty;
                  minX = Math.min(minX, worldX);
                  minY = Math.min(minY, worldY);
                  maxX = Math.max(maxX, worldX);
                  maxY = Math.max(maxY, worldY);
                }
                visibleItems += 1;
              }

              if (!Number.isFinite(minX) || !Number.isFinite(minY)) return null;
              return {
                minX, minY, maxX, maxY,
                width: maxX - minX,
                height: maxY - minY,
                centerX: (minX + maxX) * 0.5,
                centerY: (minY + maxY) * 0.5,
                bottom: maxY,
                visibleItems,
              };
            }

            function animationSamples(part, animation) {
              return (animation?.frames || [])
                .map((frame, index) => {
                  const bounds = frameVisibleBounds(part, frame);
                  return bounds ? { index, ...bounds } : null;
                })
                .filter(Boolean);
            }

            function animationGroundBottom(part, animation) {
              return median(animationSamples(part, animation).map((sample) => sample.bottom));
            }

            function stableTerminalBottom(part, animation) {
              const samples = animationSamples(part, animation);
              if (!samples.length) return NaN;
              const firstIndex = samples[0].index;
              const lastIndex = samples[samples.length - 1].index;
              const terminalStart = firstIndex + (lastIndex - firstIndex) * 0.4;
              const terminal = samples.filter((sample) => sample.index >= terminalStart);
              if (!terminal.length) return samples[samples.length - 1].bottom;

              const values = terminal.map((sample) => sample.bottom);
              const range = Math.max(...values) - Math.min(...values);
              const tolerance = Math.max(1, Math.min(8, range * 0.03));
              let bestCluster = [];
              let bestLatestIndex = -Infinity;
              for (const pivot of terminal) {
                const cluster = terminal.filter(
                  (sample) => Math.abs(sample.bottom - pivot.bottom) <= tolerance
                );
                const latestIndex = Math.max(...cluster.map((sample) => sample.index));
                if (
                  cluster.length > bestCluster.length ||
                  (cluster.length === bestCluster.length && latestIndex > bestLatestIndex)
                ) {
                  bestCluster = cluster;
                  bestLatestIndex = latestIndex;
                }
              }
              return median((bestCluster.length ? bestCluster : terminal).map((sample) => sample.bottom));
            }

            function animationProfile(part, animation) {
              const samples = animationSamples(part, animation);
              if (!samples.length) return null;
              const firstIndex = samples[0].index;
              const lastIndex = samples[samples.length - 1].index;
              const duration = Math.max(1, lastIndex - firstIndex);
              const early = samples.filter((sample) => sample.index <= firstIndex + duration * 0.35);
              const late = samples.filter((sample) => sample.index >= firstIndex + duration * 0.65);
              const earlyCenterX = median((early.length ? early : samples).map((sample) => sample.centerX));
              const lateCenterX = median((late.length ? late : samples).map((sample) => sample.centerX));
              const centerXs = samples.map((sample) => sample.centerX);
              return {
                frameCount: samples.length,
                width: median(samples.map((sample) => sample.width)),
                height: median(samples.map((sample) => sample.height)),
                visibleItems: median(samples.map((sample) => sample.visibleItems)),
                horizontalTravel: Math.abs(lateCenterX - earlyCenterX),
                horizontalRange: Math.max(...centerXs) - Math.min(...centerXs),
              };
            }

            function normalizedMotionType(attack) {
              const explicit = String(attack?.motion?.type || "").trim().toUpperCase();
              if (explicit) return explicit;
              const attackType = String(attack?.attackType || "").trim().toUpperCase();
              if (["ENERGY", "WEAPON", "DOUBLE"].includes(attackType)) return "LINEAR";
              if (["PUNCH", "KICK", "SWING", "STAB"].includes(attackType)) return "DIRECT";
              return attackType;
            }

            function dynamicAttackSlots(projectileData) {
              const slots = STANDARD_ATTACK_SLOTS.map((slot) => ({ ...slot }));
              const known = new Set(slots.map((slot) => slot.key));
              for (const key of Object.keys(projectileData || {})) {
                if (known.has(key)) continue;
                const match = key.match(/^skill(\d+)$/i);
                const attack = projectileData?.[key];
                if (!match || !attack || typeof attack !== "object") continue;
                const skillNumber = Number(match[1]);
                slots.push({
                  key,
                  defaultPart: `bul${skillNumber + 1}`,
                  bodyAnimations: [
                    `s${skillNumber}_attack_all`, `s${skillNumber}_attack`,
                    `s${skillNumber}_attack_a`, `s${skillNumber}_attack_b`,
                    `s${skillNumber}_attack_ready`, "skill", "idle", "wait",
                  ],
                });
                known.add(key);
              }
              return slots;
            }

            function bodyReferenceProfile(meta, slot) {
              const bodyPart = meta?.parts?.body;
              if (!bodyPart) return null;
              const sizeAnimation = findAnimation(bodyPart, slot.bodyAnimations);
              const groundAnimation = findAnimation(bodyPart, ["idle", "wait", ...slot.bodyAnimations]);
              const sizeProfile = animationProfile(bodyPart, sizeAnimation);
              const groundBottom = animationGroundBottom(bodyPart, groundAnimation || sizeAnimation);
              if (!sizeProfile || !Number.isFinite(groundBottom)) return null;
              return { ...sizeProfile, groundBottom };
            }

            function isActorMovementAnimation(bodyProfile, bulletPart, attackAnimation, motionType) {
              const projectileProfile = animationProfile(bulletPart, attackAnimation);
              if (!bodyProfile || !projectileProfile || projectileProfile.frameCount < 4) return false;
              if (!(bodyProfile.width > 0) || !(bodyProfile.height > 0)) return false;

              const heightRatio = projectileProfile.height / bodyProfile.height;
              const widthRatio = projectileProfile.width / bodyProfile.width;
              const itemRatio = projectileProfile.visibleItems / Math.max(1, bodyProfile.visibleItems);
              const sizeComparable =
                heightRatio >= 0.45 && heightRatio <= 2.25 &&
                widthRatio >= 0.30 && widthRatio <= 3.50;
              const compositionComparable =
                projectileProfile.visibleItems >= 2 &&
                (itemRatio >= 0.25 || projectileProfile.visibleItems >= 4);
              if (!sizeComparable || !compositionComparable) return false;

              if (motionType === "DIRECT") {
                const requiredTravel = Math.max(
                  20, bodyProfile.width * 0.18, projectileProfile.width * 0.08
                );
                return (
                  projectileProfile.horizontalTravel >= requiredTravel ||
                  projectileProfile.horizontalRange >= requiredTravel * 1.35
                );
              }
              if (motionType !== "LINEAR") return false;

              return (
                heightRatio >= 0.55 && heightRatio <= 1.95 &&
                widthRatio >= 0.35 && widthRatio <= 2.75 &&
                (itemRatio >= 0.35 ||
                  projectileProfile.visibleItems >= Math.max(4, bodyProfile.visibleItems * 0.3))
              );
            }

            function annotateActorAttack(meta, slot) {
              const projectileData = meta?.projectileData;
              const attack = projectileData?.[slot.key];
              if (!attack) return false;
              const motionType = normalizedMotionType(attack);
              if (!["DIRECT", "LINEAR"].includes(motionType)) return false;

              const requestedPartName = String(attack.animationPart || "").trim() || slot.defaultPart;
              const resolvedPartName = meta?.parts?.[requestedPartName]
                ? requestedPartName
                : (meta?.parts?.[slot.defaultPart] ? slot.defaultPart : "");
              const bulletPart = meta?.parts?.[resolvedPartName];
              if (!bulletPart) return false;

              const attackAnimation = findAnimation(
                bulletPart, ["normal", "idle", "wait", "shot", "fire", "attack", "_all"]
              );
              const bodyProfile = bodyReferenceProfile(meta, slot);
              if (
                !attackAnimation ||
                !isActorMovementAnimation(bodyProfile, bulletPart, attackAnimation, motionType)
              ) return false;

              const travelBottom = motionType === "LINEAR"
                ? animationGroundBottom(bulletPart, attackAnimation)
                : stableTerminalBottom(bulletPart, attackAnimation);
              if (!Number.isFinite(travelBottom)) return false;

              const finishAnimation = findAnimation(bulletPart, ["finish", "hit", "end"]);
              const finishBottom = stableTerminalBottom(bulletPart, finishAnimation);
              if (!meta.actorProjectileGround || typeof meta.actorProjectileGround !== "object") {
                meta.actorProjectileGround = { schemaVersion: 1, attacks: {} };
              }
              if (!meta.actorProjectileGround.attacks || typeof meta.actorProjectileGround.attacks !== "object") {
                meta.actorProjectileGround.attacks = {};
              }
              meta.actorProjectileGround.attacks[slot.key] = {
                partName: resolvedPartName,
                motionType,
                bodyGroundBottom: bodyProfile.groundBottom,
                travelBottom,
                finishBottom: Number.isFinite(finishBottom) ? finishBottom : null,
              };
              return true;
            }

            function annotateActorAttacks(meta) {
              const projectileData = meta?.projectileData;
              if (!projectileData) return false;
              let changed = false;
              for (const slot of dynamicAttackSlots(projectileData)) {
                changed = annotateActorAttack(meta, slot) || changed;
              }
              return changed;
            }

            async function patchAnimationMetadata(response, url) {
              if (
                !response.ok ||
                !animationMetaPattern.test(String(url || "")) ||
                /\/index\.json(?:[?#]|$)/i.test(String(url || ""))
              ) return response;

              try {
                const meta = await response.clone().json();
                if (!annotateActorAttacks(meta)) return response;
                const headers = new Headers(response.headers);
                headers.set("content-type", "application/json; charset=utf-8");
                return new Response(JSON.stringify(meta), {
                  status: response.status,
                  statusText: response.statusText,
                  headers,
                });
              } catch (error) {
                console.warn("Actor projectile ground annotation failed:", error);
                return response;
              }
            }

            window.fetch = async (...args) => {
              const response = await upstreamFetch(...args);
              const requestUrl = args[0] instanceof Request ? args[0].url : String(args[0] || "");
              return patchAnimationMetadata(response, requestUrl);
            };
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('assets/js/ranger-animation-viewer.js')
          text = path.read_text()

          old = '  const sceneBridge = sharedBridge("RangerAnimationSceneBridge");\n  const targetBridge = sharedBridge("RangerAnimationTargetBridge");'
          new = old + '\n  const playbackBridge = sharedBridge("RangerAnimationPlaybackBridge");'
          if text.count(old) != 1:
              raise SystemExit('viewer bridge insertion anchor mismatch')
          text = text.replace(old, new, 1)

          replacement = r'''  function actorProjectileGroundFor(meta, clip, partName, motionType) {
            const ground = meta?.actorProjectileGround?.attacks?.[clip.dataKey];
            if (!ground || ground.partName !== partName || ground.motionType !== motionType) return null;
            const travelBottom = finiteNumber(ground.travelBottom, NaN);
            if (!Number.isFinite(travelBottom)) return null;
            return {
              motionType,
              travelBottom,
              finishBottom: finiteNumber(ground.finishBottom, NaN),
              bodyGroundBottom: finiteNumber(ground.bodyGroundBottom, NaN),
            };
          }

          function projectileImpactOffset(projectile, bodyPart) {
            if (projectile.renderMode === "AUTHORED_FINISH") return 0;
            if (projectile.renderMode === "BEAM") return projectile.beamDuration;
            if (["AUTHORED", "DIRECT"].includes(projectile.renderMode)) {
              return projectile.localNormalDuration;
            }

            const layout = referenceLayout(projectile.attackRange);
            const geometry = resolveProjectileGeometry(projectile, bodyPart, layout, layout.sceneScale);
            if (projectile.renderMode === "RETURN" && geometry.flightDuration > 0) {
              return geometry.flightDuration;
            }
            if (["LINEAR", "CURVE"].includes(projectile.renderMode) && geometry.flightDuration > 0) {
              return geometry.flightDuration;
            }
            return Math.max(
              projectile.localNormalDuration,
              15 / Math.max(1, bodyPart?.anim_rate || 24)
            );
          }

          function estimateProjectileLifetime(projectile, bodyPart) {
            const layout = referenceLayout(projectile.attackRange);
            const geometry = resolveProjectileGeometry(projectile, bodyPart, layout, layout.sceneScale);

            if (projectile.renderMode === "RETURN" && geometry.flightDuration > 0) {
              return geometry.flightDuration + geometry.returnDuration;
            }
            if (projectile.renderMode === "BEAM") {
              return projectile.beamDuration + projectile.finishDuration;
            }
            if (projectile.renderMode === "AUTHORED_FINISH") return projectile.finishDuration;
            if (["AUTHORED", "DIRECT"].includes(projectile.renderMode)) {
              return projectile.localNormalDuration + projectile.finishDuration;
            }
            if (["LINEAR", "CURVE"].includes(projectile.renderMode) && geometry.flightDuration > 0) {
              return geometry.flightDuration + projectile.finishDuration;
            }
            return Math.max(
              projectile.localNormalDuration,
              15 / Math.max(1, bodyPart?.anim_rate || 24)
            ) + projectile.finishDuration;
          }
'''
          text, count = re.subn(
              r'  function estimateProjectileLifetime\(projectile, bodyPart\) \{.*?\n  \}\n(?=\n  function buildProjectile)',
              replacement.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('estimateProjectileLifetime replacement failed')

          old = '''      attackRange: attackRangeForMeta(meta),
      isBasicAttack: clip.isBasicAttack === true,
    };
    projectile.lifetime = estimateProjectileLifetime(projectile, bodyPart);'''
          new = '''      attackRange: attackRangeForMeta(meta),
      isBasicAttack: clip.isBasicAttack === true,
      actorGround: actorProjectileGroundFor(
        meta,
        clip,
        bulletPart === meta?.parts?.[requestedPartName] ? requestedPartName : clip.bullet,
        motionType,
      ),
    };
    projectile.impactOffset = projectileImpactOffset(projectile, bodyPart);
    projectile.lifetime = estimateProjectileLifetime(projectile, bodyPart);'''
          if text.count(old) != 1:
              raise SystemExit('projectile object anchor mismatch')
          text = text.replace(old, new, 1)

          compute_track = r'''  function computeTrack(meta, clipKey) {
            const clip = CLIPS.find((item) => item.key === clipKey) || CLIPS[0];
            if (clip.sequence) {
              const segments = [];
              let cursor = 0;
              for (const childKey of clip.sequence) {
                const childTrack = buildTrack(meta, childKey);
                if (!childTrack.segments.length) continue;
                for (const segment of childTrack.segments) {
                  segments.push({ ...segment, start: (segment.start || 0) + cursor });
                }
                cursor += childTrack.duration || 0;
              }
              return { key: clip.key, label: clip.label, segments, duration: cursor || 1 };
            }

            const bodyPart = meta?.parts?.body;
            const bodyAnimation = getAnim(bodyPart, clip.body);
            if (!bodyAnimation) return { key: clip.key, label: clip.label, segments: [], duration: 0 };
            const bodyDuration = animDuration(bodyPart, bodyAnimation) || 1;
            const projectile = buildProjectile(meta, clip, bodyPart, bodyAnimation, bodyDuration);
            const duration = Math.max(
              bodyDuration,
              projectile ? projectile.spawnTime + projectile.lifetime : 0,
              1
            );
            const spawnTime = projectile
              ? projectile.spawnTime
              : nativeProjectileSpawnTime(bodyPart, bodyAnimation.name, clip, bodyDuration);
            const impactTime = clip.isBasicAttack
              ? spawnTime + (projectile ? projectile.impactOffset : 0)
              : null;
            return {
              key: clip.key,
              label: clip.label,
              segments: [{
                clipKey: clip.key,
                partName: "body",
                animName: bodyAnimation.name,
                start: 0,
                duration,
                bodyDuration,
                loop: clip.key === "idle",
                projectile,
                impactTime,
              }],
              duration,
            };
          }
'''
          text, count = re.subn(
              r'  function computeTrack\(meta, clipKey\) \{.*?\n  \}\n(?=\n  function buildTrack)',
              compute_track.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('computeTrack replacement failed')

          geometry = r'''  function resolveProjectileGeometry(projectile, bodyPart, layout, sceneScale) {
            let start = resolveStartScreen(projectile, layout, sceneScale);
            let baseEnd = resolveOutboundBaseEnd(projectile, layout, sceneScale);
            let end = resolveOutboundEnd(projectile, bodyPart, layout, sceneScale);

            // Character-as-projectile LINEAR attacks use the SAM lower edge as a
            // visual foot anchor. Keep UnitData start/end/hitTiming untouched and
            // align only the screen-space origins to the two ground lines.
            if (projectile.actorGround?.motionType === "LINEAR") {
              const travelBottom = projectile.actorGround.travelBottom;
              const targetGroundY = selectedTargetAnchor(layout).baseY;
              start = {
                x: start.x,
                y: layout.actorY - travelBottom * sceneScale,
              };
              baseEnd = {
                x: baseEnd.x,
                y: targetGroundY - travelBottom * sceneScale,
              };
              end = {
                x: end.x,
                y: targetGroundY - travelBottom * sceneScale,
              };
            }

            const endX = end.x;
            const endY = end.y;
            const nativeDistance = Math.hypot(
              baseEnd.x - start.x,
              baseEnd.y - start.y
            ) / Math.max(0.0001, sceneScale);
            const flightDuration = movementDuration(nativeDistance, projectile.moveSpeed);
            const returnEnd = resolveReturnEnd(projectile, layout, sceneScale);
            const returnNativeDistance = Math.hypot(
              returnEnd.x - endX,
              returnEnd.y - endY
            ) / Math.max(0.0001, sceneScale);
            const returnDuration = movementDuration(returnNativeDistance, projectile.moveSpeed);
            return {
              startX: start.x,
              startY: start.y,
              baseEndX: baseEnd.x,
              baseEndY: baseEnd.y,
              endX,
              endY,
              nativeDistance,
              flightDuration,
              returnEndX: returnEnd.x,
              returnEndY: returnEnd.y,
              returnNativeDistance,
              returnDuration,
              facing: layout.facing,
            };
          }

          function actorGroundOriginY(projectile, layout, sceneScale, finish = false) {
            if (!projectile.actorGround) return NaN;
            const bottom = finish && Number.isFinite(projectile.actorGround.finishBottom)
              ? projectile.actorGround.finishBottom
              : projectile.actorGround.travelBottom;
            if (!Number.isFinite(bottom)) return NaN;
            return selectedTargetAnchor(layout).baseY - bottom * sceneScale;
          }
'''
          text, count = re.subn(
              r'  function resolveProjectileGeometry\(projectile, bodyPart, layout, sceneScale\) \{.*?\n  \}\n(?=\n  async function drawProjectileFrame)',
              geometry.rstrip(), text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('resolveProjectileGeometry replacement failed')

          old = '''    if (renderMode === "DIRECT") {
      if (age <= projectile.localNormalDuration || !projectile.finishAnimName) {
        await drawProjectileFrame(context, bulletPart, projectile.normalAnimName, age, projectile.loopNormal, geometry.endX, geometry.endY, sceneScale, sceneScale);
      } else {
        await drawFinish(context, bulletPart, projectile, age - projectile.localNormalDuration, geometry.endX, geometry.endY, sceneScale);
      }
      return;
    }'''
          new = '''    if (renderMode === "DIRECT") {
      const groundedNormalY = actorGroundOriginY(projectile, layout, sceneScale, false);
      const groundedFinishY = actorGroundOriginY(projectile, layout, sceneScale, true);
      const normalY = Number.isFinite(groundedNormalY) ? groundedNormalY : geometry.endY;
      const finishY = Number.isFinite(groundedFinishY) ? groundedFinishY : geometry.endY;
      if (age <= projectile.localNormalDuration || !projectile.finishAnimName) {
        await drawProjectileFrame(
          context,
          bulletPart,
          projectile.normalAnimName,
          age,
          projectile.loopNormal,
          geometry.endX,
          normalY,
          sceneScale,
          sceneScale,
        );
      } else {
        await drawFinish(
          context,
          bulletPart,
          projectile,
          age - projectile.localNormalDuration,
          geometry.endX,
          finishY,
          sceneScale,
        );
      }
      return;
    }'''
          if text.count(old) != 1:
              raise SystemExit('DIRECT render block mismatch')
          text = text.replace(old, new, 1)

          old = '    await drawFinish(context, bulletPart, projectile, age - duration, geometry.endX, geometry.endY, sceneScale);\n  }'
          new = '''    const groundedFinishY = actorGroundOriginY(projectile, layout, sceneScale, true);
    await drawFinish(
      context,
      bulletPart,
      projectile,
      age - duration,
      geometry.endX,
      Number.isFinite(groundedFinishY) ? groundedFinishY : geometry.endY,
      sceneScale,
    );
  }'''
          if text.count(old) != 1:
              raise SystemExit('generic finish block mismatch')
          text = text.replace(old, new, 1)

          playback_helpers = r'''  function playbackPlanForTrack(track) {
            const attackSegment = (track?.segments || []).find(
              (segment) => segment.clipKey === "attack" && Number.isFinite(segment.impactTime)
            );
            const projectile = attackSegment?.projectile || null;
            return {
              source: "viewer",
              selectedClip: state.activeClip,
              startedAt: state.startedAt,
              cycleDuration: Math.max(0, finiteNumber(track?.duration, 0)),
              impactTime: attackSegment
                ? (attackSegment.start || 0) + attackSegment.impactTime
                : null,
              hasProjectile: Boolean(projectile),
              motionType: projectile?.motionType || "NONE",
            };
          }

          function publishPlaybackPlan(section, track) {
            const plan = playbackPlanForTrack(track);
            playbackBridge.set(section, plan);
            section?.dispatchEvent(new CustomEvent("ranger-animation-playback-plan", {
              detail: plan,
            }));
          }

'''
          anchor = '  function stopPlayback() {'
          if text.count(anchor) != 1:
              raise SystemExit('stopPlayback insertion anchor mismatch')
          text = text.replace(anchor, playback_helpers + anchor, 1)

          old = '''  function stopPlayback() {
    if (state.rafId) cancelAnimationFrame(state.rafId);
    state.rafId = 0;
    const projectileCanvas = state.activeSection?.querySelector(".ranger-animation-projectile-canvas");
    const projectileContext = projectileCanvas?.getContext("2d");
    projectileContext?.clearRect(0, 0, projectileCanvas.width, projectileCanvas.height);
  }'''
          new = '''  function stopPlayback() {
    if (state.rafId) cancelAnimationFrame(state.rafId);
