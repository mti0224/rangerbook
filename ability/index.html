<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能力｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../assets/css/ability-detail-table.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>能力</h1>
      <p>
        查詢能力的詳細數據。
      </p>
    </section>

    <section class="controls">
      <label class="search-box">
        <span>搜尋能力</span>
        <input id="searchInput" type="search" placeholder="輸入名稱、敘述、效果或條件...">
      </label>

      <label>
        <span>能力分類</span>
        <select id="categoryFilter">
          <option value="">全部</option>
          <option value="覺醒">覺醒</option>
          <option value="敵人">敵人</option>
          <option value="迷宮">迷宮</option>
          <option value="小隊">小隊</option>
          <option value="一般">一般</option>
        </select>
      </label>

      <label>
        <span>發動時機</span>
        <select id="timingFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>
        <span>場合</span>
        <select id="modeFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>
        <span>條件</span>
        <select id="conditionFilter">
          <option value="">全部</option>
        </select>
      </label>

      <button id="resetBtn" type="button">清除篩選</button>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="resultCount">0</strong>
        <span>筆結果</span>
      </div>
    </section>

    <section class="layout modal-list-layout">
      <div id="abilityList" class="ability-list"></div>
    </section>
  </main>

  <div id="abilityModal" class="modal-backdrop" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="abilityModalTitle">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="關閉詳細資料">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/ability.js"></script>
  <script src="../assets/js/ability-detail-table-fix.js"></script>
</body>
</html>
