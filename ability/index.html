<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能力｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../assets/css/ability-detail-table.css">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261013b">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1 data-i18n="ability.title">能力</h1>
      <p>
        <span data-i18n="ability.intro">查詢能力的詳細數據。</span>
      </p>
    </section>

    <section class="controls">
      <label class="search-box">
        <span data-i18n="ability.search">搜尋能力</span>
        <input id="searchInput" type="search" placeholder="輸入名稱、敘述、效果或條件..." data-i18n-placeholder="ability.placeholder">
      </label>

      <label>
        <span data-i18n="ability.category">能力分類</span>
        <select id="categoryFilter">
          <option value="" data-i18n="ranger.all">全部</option>
          <option value="覺醒">覺醒</option>
          <option value="敵人">敵人</option>
          <option value="迷宮">迷宮</option>
          <option value="小隊">小隊</option>
          <option value="一般">一般</option>
        </select>
      </label>

      <label>
        <span data-i18n="ability.timing">發動時機</span>
        <select id="timingFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <label>
        <span data-i18n="ability.mode">場合</span>
        <select id="modeFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <label>
        <span data-i18n="ability.condition">條件</span>
        <select id="conditionFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <button id="resetBtn" type="button" data-i18n="filter.reset">清除篩選</button>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="resultCount">0</strong>
        <span data-i18n="filter.result">筆結果</span>
      </div>
    </section>

    <section class="layout modal-list-layout">
      <div id="abilityList" class="ability-list"></div>
    </section>
  </main>

  <div id="abilityModal" class="modal-backdrop" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="abilityModalTitle">
      <button id="modalCloseBtn" class="modal-close" type="button" aria-label="關閉詳細資料">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="../assets/js/v2-data.js?v=20261013-v2.5"></script>
  <script src="../assets/js/i18n.js?v=20261013-v2.5"></script>
  <script src="../assets/js/site.js?v=20261013-nav1"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-auth-compat.js"></script>
  <script>
    RangerbookAdminCompat.loadScripts([
      "../assets/js/ability.js?v=20261013-v2.5",
      "../assets/js/ability-detail-table-fix.js"
    ]).catch(console.error);
  </script>
</body>
</html>
