<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rangers｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/ranger-compare.css">
  <link rel="stylesheet" href="../assets/css/hub-entry.css">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261011a">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>Rangers</h1>
      <p data-i18n="ranger.hub.desc">選擇要查詢或比對的Rangers功能。</p>
    </section>

    <section class="ranger-hub-grid" aria-label="Rangers 功能入口">
      <a class="ranger-hub-card" href="./ranger/">
        <div>
          <h2 data-i18n="ranger.title">Rangers數據</h2>
          <p data-i18n="ranger.hub.data.desc">查詢每隻Ranger的詳細數據與技能。</p>
        </div>
      </a>

      <a class="ranger-hub-card" href="./compare/">
        <div>
          <h2 data-i18n="ranger.hub.compare">Rangers比對</h2>
          <p data-i18n="ranger.hub.compare.desc">選擇兩隻Rangers，進行數據比對。</p>
        </div>
      </a>

      <a class="ranger-hub-card" href="./stats/">
        <div>
          <h2 data-i18n="ranger.hub.stats">統計資料</h2>
          <p data-i18n="ranger.hub.stats.desc">依時間區間統計各類型Rangers的數據。</p>
        </div>
      </a>

      <a class="ranger-hub-card" href="./ranking/">
        <div>
          <h2 data-i18n="ranger.hub.rank">數據排名</h2>
          <p data-i18n="ranger.hub.rank.desc">查看Rangers各項數據的排名。</p>
        </div>
      </a>
    </section>
  </main>

  <script src="../assets/js/v2-data.js?v=20261013-v2.5"></script>
  <script src="../assets/js/i18n.js?v=20261013-v2.5"></script>
  <script src="../assets/js/site.js?v=20261013-v2.5"></script>
</body>
</html>
