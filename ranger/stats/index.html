<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var prefix = window.location.pathname.includes('/rangerbook/') ? '/rangerbook/ranger/stats/' : '/ranger/stats/';
      document.write('<base href="' + prefix + '">');
    })();
  </script>
  <title>Rangers統計資料｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger-compare.css">
  <link rel="stylesheet" href="../../assets/css/ranger-stats.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page ranger-stats-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>Rangers統計資料</h1>
      <p>依指定登場時間區間，統計力量、敏捷、智慧角色的平均魔法攻擊力、物理攻擊力與體力。</p>
    </section>

    <section class="stats-controls" aria-label="統計篩選條件">
      <label>
        <span>開始日期</span>
        <input id="statsStartDate" type="date">
      </label>
      <label>
        <span>結束日期</span>
        <input id="statsEndDate" type="date">
      </label>
      <button id="statsApplyBtn" type="button">套用區間</button>
      <button id="statsResetBtn" type="button">全部時間</button>
    </section>

    <section class="stats-summary" aria-label="統計摘要">
      <div>
        <span>統計角色數</span>
        <strong id="statsIncludedCount">0</strong>
      </div>
      <div>
        <span>排除角色數</span>
        <strong id="statsExcludedCount">0</strong>
      </div>
      <div>
        <span>目前區間</span>
        <strong id="statsRangeLabel">全部時間</strong>
      </div>
    </section>

    <section class="stats-section">
      <h2>平均數值</h2>
      <div id="statsTableWrap" class="stats-table-wrap"></div>
    </section>

    <section class="stats-section">
      <h2>排除規則</h2>
      <p class="stats-note">統計時會排除持有「對空迎擊」或「飛翔能力」的角色。</p>
    </section>
  </main>

  <script src="../../assets/js/site.js"></script>
  <script src="../../assets/js/ranger-stats.js"></script>
</body>
</html>
