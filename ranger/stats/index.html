<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var prefix = window.location.pathname.includes('/rangerbook/') ? '/rangerbook/ranger/stats/' : '/ranger/stats/';
      document.write('<base href="' + prefix + '">');
    })();
  </script>
  <title>Rangers統計資料｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger-compare.css">
  <link rel="stylesheet" href="../../assets/css/ranger-stats.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page ranger-stats-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>Rangers統計資料</h1>
      <p>統計特定時間內，各類型角色的魔法攻擊力、物理攻擊力與體力的五標及平均。</p>
      <p class="stats-help-text"><a href="./marks/">什麼是五標？</a></p>
    </section>

    <section class="stats-summary" aria-label="統計摘要">
      <div>
        <span>統計角色數</span>
        <strong id="statsIncludedCount">0</strong>
      </div>
      <div>
        <span>排除角色數(飛翔、對空迎擊)</span>
        <strong id="statsExcludedCount">0</strong>
      </div>
      <div>
        <span>時間區間</span>
        <strong id="statsRangeLabel">載入中</strong>
      </div>
    </section>

    <section class="stats-type-tabs" aria-label="角色類型切換">
      <button class="stats-type-button active" type="button" data-type="力量">力量</button>
      <button class="stats-type-button" type="button" data-type="敏捷">敏捷</button>
      <button class="stats-type-button" type="button" data-type="智慧">智慧</button>
    </section>

    <details id="statsTrendPanel" class="stats-trend-panel">
      <summary>五標與平均趨勢圖</summary>
      <div class="stats-trend-content">
        <div class="stats-trend-controls">
          <label>
            <span>選擇數據</span>
            <select id="statsTrendMetricSelect"></select>
          </label>
          <p id="statsTrendRangeText" class="stats-trend-range">載入中</p>
        </div>
        <div class="stats-trend-chart-wrap">
          <canvas id="statsTrendChart" width="960" height="420" aria-label="五標與平均趨勢圖"></canvas>
        </div>
        <div id="statsTrendLegend" class="stats-trend-legend" aria-label="圖例"></div>
        <p id="statsTrendEmpty" class="stats-trend-empty" hidden>沒有足夠資料可以繪製圖表。</p>
      </div>
    </details>

    <div id="statsSections" class="stats-sections" aria-label="統計表格"></div>
  </main>

  <script src="../../assets/js/site.js"></script>
  <script src="../../assets/js/ranger-stats.js"></script>
</body>
</html>
