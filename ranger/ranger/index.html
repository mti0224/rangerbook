<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var prefix = window.location.pathname.includes('/rangerbook/') ? '/rangerbook/ranger/' : '/ranger/';
      document.write('<base href="' + prefix + '">');
    })();
  </script>
  <title>Rangers數據｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ranger.css">
  <link rel="stylesheet" href="../assets/css/ranger-detail.css">
  <link rel="stylesheet" href="../assets/css/ranger-page-mode.css">
  <link rel="stylesheet" href="../assets/css/ranger-level-slider.css">
  <link rel="stylesheet" href="../assets/css/ranger-pagination.css">
  <link rel="stylesheet" href="../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../assets/css/ranger-advanced-filters.css">
  <link rel="stylesheet" href="../assets/css/ranger-animation-viewer.css">
  <link rel="stylesheet" href="../assets/css/ranger-grouped-detail-items.css">
  <script>
    // Resolve canonical CSS paths before the speculative preloader reads links.
    // The detail route sets a dynamic <base>; relative links can be prefetched
    // from an incorrect directory before that <base> becomes active.
    (function () {
      var root = window.location.pathname.indexOf("/rangerbook/") === 0 ? "/rangerbook/" : "/";
      ["header-responsive.css?v=20260429c","mobile-interaction-fix.css?v=20260430c","theme-toggle.css?v=20260525a","game-tech.css?v=20261013-v2.5","game-tech-controls.css?v=20261010a"].forEach(function (file) {
        document.write('<link rel="stylesheet" href="' + root + "assets/css/" + file + '">');
      });
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261011a">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1 data-i18n="ranger.title">Rangers數據</h1>
      <p>
        <span data-i18n="ranger.intro">查詢每隻角色的詳細數據。</span>
      </p>
    </section>

    <section class="controls ranger-controls">
      <label class="search-box">
        <span data-i18n="ranger.search">搜尋角色</span>
        <input id="rangerSearchInput" type="search" data-i18n-placeholder="ranger.placeholder" placeholder="輸入角色名稱、ID或關鍵字...">
      </label>

      <label>
        <span data-i18n="ranger.star">星數</span>
        <select id="starFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <label>
        <span data-i18n="ranger.type">類型</span>
        <select id="typeFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <label>
        <span data-i18n="ranger.element">屬性</span>
        <select id="elementFilter">
          <option value="" data-i18n="ranger.all">全部</option>
        </select>
      </label>

      <button id="rangerAdvancedToggleBtn" class="advanced-toggle-btn" type="button" aria-expanded="false" aria-controls="rangerAdvancedFilters">
        進階篩選 ▼
      </button>

      <div id="rangerAdvancedFilters" class="advanced-filters" hidden>
        <label>
          <span>角色分類</span>
          <select id="specialFilter">
            <option value="" data-i18n="ranger.all">全部</option>
            <option value="nft">NFT角色</option>
            <option value="event">降臨關卡角色</option>
            <option value="talent">有才能</option>
          </select>
        </label>

        <label>
          <span>技能效果包含</span>
          <select id="skillEffectFilter">
            <option value="" data-i18n="ranger.all">全部</option>
          </select>
        </label>

        <label>
          <span>能力 / 覺醒能力包含</span>
          <select id="abilityEffectFilter">
            <option value="" data-i18n="ranger.all">全部</option>
          </select>
        </label>

        <label>
          <span>才能條件為</span>
          <select id="talentConditionFilter">
            <option value="" data-i18n="ranger.all">全部</option>
          </select>
        </label>

        <label>
          <span>才能效果包含</span>
          <select id="talentEffectFilter">
            <option value="" data-i18n="ranger.all">全部</option>
          </select>
        </label>
      </div>

      <button id="rangerResetBtn" type="button">清除篩選</button>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="rangerResultCount">0</strong>
        <span>筆結果</span>
      </div>
    </section>

    <section class="ranger-list-layout">
      <div id="rangerList" class="ranger-list"></div>
    </section>
  </main>

  <div id="rangerModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="rangerModalTitle">
      <button id="rangerModalCloseBtn" class="modal-close" type="button" aria-label="關閉角色詳細資料">×</button>
      <div id="rangerModalContent"></div>
    </div>
  </div>

  <script src="../assets/js/v2-data.js?v=20261013-v2.5"></script>
  <script src="../assets/js/i18n.js?v=20261013-v2.5"></script>
  <script src="../assets/js/site.js?v=20261013-v2.5"></script>
  <script src="../assets/js/ranger-animation-horizontal-projectile-rule.js"></script>
  <script src="../assets/js/ranger-animation-projectile-data.js"></script>
  <script src="../assets/js/ranger-animation-ground-endpoint-fix.js"></script>
  <script src="../assets/js/ranger-animation-projectile-engine.js"></script>
  <script src="../assets/js/ranger-animation-projectile-engine-adapter.js"></script>
  <script src="../assets/js/ranger-animation-projectile-shadow.js"></script>
  <script src="../assets/js/ranger-animation-projectile-double-shadow.js"></script>
  <script src="../assets/js/ranger-animation-projectile-authority.js"></script>
  <script src="../assets/js/ranger-animation-projectile-double-authority.js"></script>
  <script src="../assets/js/ranger-animation-simulation-bridge.js"></script>
  <script src="../assets/js/ranger-animation-hit-effect-timing.js"></script>
  <script src="../assets/js/ranger-animation-debug-overlay.js"></script>
  <script src="../assets/js/ranger.js?v=20261013-v2.5" defer></script>
  <script src="../assets/js/ranger-animation-target.js" defer></script>
  <script src="../assets/js/ranger-animation-hit-effect.js" defer></script>
</body>
</html>
