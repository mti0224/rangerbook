<!doctype html>
<html lang="zh-Hant">
<head>

  <script>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body class="gt-app">
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>Rangers比對</h1>
      <p>搜尋並選擇兩隻角色，左右對齊比較各項數據。</p>
    </section>

    <section class="compare-controls" aria-label="選擇比對角色">
      <label class="compare-picker">
        <span>角色 A</span>
        <input id="compareLeftInput" type="search" placeholder="搜尋第一隻角色...">
        <div id="compareLeftSuggestions" class="compare-suggestions" hidden></div>
      </label>

      <label class="compare-picker">
        <span>角色 B</span>
        <input id="compareRightInput" type="search" placeholder="搜尋第二隻角色...">
        <div id="compareRightSuggestions" class="compare-suggestions" hidden></div>
      </label>

    <section id="compareSelected" class="compare-board"></section>
    <section id="compareResult" class="compare-board"></section>
