<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無限之塔關卡資訊｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger.css">
  <link rel="stylesheet" href="../../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../../assets/css/hsEnemy.css">
  <link rel="stylesheet" href="../../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../../assets/css/endless.css">
  <link rel="stylesheet" href="../../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../../assets/css/game-tech.css?v=20261010b">
  <link rel="stylesheet" href="../../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../../assets/css/sidebar-drawer.css?v=20261011a">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>無限之塔關卡資訊</h1>
      <p>選擇樓層後查看該樓層的敵人生產線資訊。</p>
    </section>

    <section id="endlessStageGrid" class="endless-stage-grid" aria-label="無限之塔樓層選擇"></section>

    <section id="endlessStageDetail" hidden>
      <div class="endless-stage-head">
        <h1 id="endlessStageTitle" class="endless-stage-title"></h1>
        <a class="endless-back-link" href="../stage/">返回關卡選擇</a>
      </div>
      <div id="endlessStageTable"></div>
    </section>
  </main>

  <div id="endlessEnemyModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="endlessEnemyModalTitle">
      <button id="endlessEnemyModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="endlessEnemyModalContent"></div>
    </div>
  </div>

  <script src="../../assets/js/v2-data.js?v=20261013-v2.3"></script>
  <script src="../../assets/js/site.js?v=20261013-v2.3"></script>
  <script>
    window.__originalFetchForEndlessStage = window.fetch.bind(window);
    window.fetch = (resource, options) => {
      const url = String(resource);
      if (url.includes("../res/%E7%84%A1%E9%99%90%E4%B9%8B%E5%A1%94%E6%95%B5%E4%BA%BA%E7%94%9F%E7%94%A2%E7%B7%9A.json")) {
        return window.__originalFetchForEndlessStage("../../res/%E7%84%A1%E9%99%90%E4%B9%8B%E5%A1%94%E6%95%B5%E4%BA%BA%E7%94%9F%E7%94%A2%E7%B7%9A.json", options);
      }
      if (url.includes("../res/infEnemy_data.json")) {
        return window.__originalFetchForEndlessStage("../../res/infEnemy_data.json", options);
      }
      return window.__originalFetchForEndlessStage(resource, options);
    };
  </script>
  <script src="../../assets/js/endless-stage.js"></script>
  <script src="../../assets/js/card-tag-colors.js"></script>
</body>
</html>
