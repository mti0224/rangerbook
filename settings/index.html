<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script src="../assets/js/pwa-head.js"></script>

  <script>
    (() => {
      const root = location.pathname.startsWith("/rangerbook/") ? "/rangerbook/" : "/";
      document.write('<script src="' + root + 'assets/js/visitor-region.js?v=20261013-region1"><\/script>');
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) { document.documentElement.dataset.theme = "light"; }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>設定｜LINE Rangers Database</title>
  <meta name="description" content="設定 LINE Rangers 資料站的顯示模式與語言。">
  <link rel="icon" type="image/png" href="../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/settings-page.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261014-toggle1">
</head>
<body class="gt-app">
  <div id="site-header"></div>
  <main class="page rb-settings-page">
    <header class="rb-settings-header">
      <span class="rb-settings-eyebrow">RANGERBOOK / PREFERENCES</span>
      <h1 data-i18n="settings.title">設定</h1>
      <p data-i18n="settings.description">自訂本站的顯示模式與語言偏好。</p>
    </header>
    <section class="rb-settings-panel" aria-labelledby="appearanceTitle">
      <div class="rb-settings-section-head">
        <span class="rb-settings-section-icon" aria-hidden="true">◐</span>
        <div>
          <h2 id="appearanceTitle" data-i18n="settings.appearance">顯示模式</h2>
          <p data-i18n="settings.theme.help">選擇適合自己的顏色主題。</p>
        </div>
      </div>
      <fieldset class="rb-choice-group" id="settingsTheme">
        <legend class="sr-only" data-i18n="settings.appearance">顯示模式</legend>
        <label class="rb-choice">
          <input type="radio" name="theme" value="light">
          <span class="rb-choice-body"><strong data-i18n="settings.light">淺色模式</strong><span class="rb-choice-preview light" aria-hidden="true"></span></span>
        </label>
        <label class="rb-choice">
          <input type="radio" name="theme" value="dark">
          <span class="rb-choice-body"><strong data-i18n="settings.dark">深色模式</strong><span class="rb-choice-preview dark" aria-hidden="true"></span></span>
        </label>
      </fieldset>
    </section>
    <section class="rb-settings-panel" aria-labelledby="languageTitle">
      <div class="rb-settings-section-head">
        <span class="rb-settings-section-icon rb-settings-language-icon" data-i18n="copy.language" aria-hidden="true">文</span>
        <div>
          <h2 id="languageTitle" data-i18n="settings.language">網站語言</h2>
          <p data-i18n="settings.lang.help">切換後將重新載入網頁，並保留你的選擇。</p>
        </div>
      </div>
      <fieldset class="rb-choice-group" id="settingsLanguage">
        <legend class="sr-only" data-i18n="settings.language">網站語言</legend>
        <label class="rb-choice">
          <input type="radio" name="language" value="zh-Hant">
          <span class="rb-choice-body"><strong data-i18n="settings.zh">繁體中文</strong><small>繁體中文</small></span>
        </label>
        <label class="rb-choice">
          <input type="radio" name="language" value="en">
          <span class="rb-choice-body"><strong data-i18n="settings.en">English</strong><small>English</small></span>
        </label>
        <label class="rb-choice">
          <input type="radio" name="language" value="jp">
          <span class="rb-choice-body"><strong data-i18n="settings.jp">日本語</strong><small>日本語</small></span>
        </label>
        <label class="rb-choice">
          <input type="radio" name="language" value="th">
          <span class="rb-choice-body"><strong data-i18n="settings.th">ภาษาไทย</strong><small>ภาษาไทย</small></span>
        </label>
      </fieldset>
    </section>
    <section class="rb-settings-panel rb-pwa-panel" id="pwaSettings" aria-labelledby="pwaTitle">
      <h2 id="pwaTitle" data-i18n="pwa.installTitle">安裝 Rangerbook</h2>
      <p data-pwa-availability data-i18n="pwa.browserHelp">可在支援的瀏覽器選單中尋找安裝或加入主畫面的選項。</p>
      <button class="rb-pwa-button" type="button" data-pwa-install hidden data-i18n="pwa.installTitle">安裝 Rangerbook</button>
      <details data-pwa-ios hidden>
        <summary data-i18n="pwa.iosTitle">iPhone / iPad 安裝方式</summary>
        <p data-i18n="pwa.iosHelp">在 Safari 開啟本站，點選分享選單，再選擇「加入主畫面」。若有「作為網頁 App 開啟」選項，請將它開啟，再點選「加入」。</p>
      </details>
    </section>
    <p class="rb-settings-feedback" role="status" aria-live="polite" id="settingsFeedback"></p>
    <a href="../" class="rb-settings-back" data-i18n="settings.back">返回首頁</a>
  </main>
  <script src="../assets/js/v2-data.js?v=20261013-thai1"></script>
  <script src="../assets/js/i18n.js?v=20261013-region1"></script>
  <script src="../assets/js/site.js?v=20261014-toggle1"></script>
  <script src="../assets/js/settings.js?v=20261013-v2.5"></script>
</body>
</html>
