<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      const root = location.pathname.startsWith("/rangerbook/") ? "/rangerbook/" : "/";
      document.write('<script src="' + root + 'assets/js/visitor-region.js?v=20261013-region1"><\/script>');
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷宮關卡資訊｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger.css">
  <link rel="stylesheet" href="../../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../../assets/css/hsEnemy.css">
  <link rel="stylesheet" href="../../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../../assets/css/endless.css">
  <link rel="stylesheet" href="../../assets/css/hs-stage.css">
  <link rel="stylesheet" href="../../assets/css/labyrinth.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../../assets/css/sidebar-drawer.css?v=20261014-toggle1">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>迷宮關卡資訊</h1>
      <p>選擇關卡後查看該關卡各難度的敵人生產線資訊。</p>
      <p class="labyrinth-stage-help-link-wrap"><a class="labyrinth-stage-help-link" href="./how_to_find_stage/">如何查詢關卡</a></p>
    </section>

    <section id="labyrinthStageGrid" class="labyrinth-stage-grid" aria-label="迷宮關卡選擇"></section>

    <section id="labyrinthStageDetail" hidden>
      <div class="endless-stage-head labyrinth-stage-head">
        <h1 id="labyrinthStageTitle" class="endless-stage-title"></h1>
        <a class="endless-back-link" href="../stage/">返回關卡選擇</a>
      </div>

      <section id="labyrinthDifficultyControls" class="labyrinth-difficulty-controls" hidden>
        <label>
          <span>選擇難度</span>
          <select id="labyrinthDifficultySelect"></select>
        </label>
      </section>

      <div id="labyrinthStageContent"></div>
    </section>
  </main>

  <div id="labyrinthEnemyLineModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="labyrinthEnemyLineModalTitle">
      <button id="labyrinthEnemyLineModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="labyrinthEnemyLineModalContent"></div>
    </div>
  </div>

  <script src="../../assets/js/v2-data.js?v=20261013-thai1"></script>
  <script src="../../assets/js/site.js?v=20261014-toggle1"></script>
  <script src="../../assets/js/labyrinth-stage.js"></script>
  <script src="../../assets/js/card-tag-colors.js"></script>
</body>
</html>
