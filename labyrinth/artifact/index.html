<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷宮遺物資訊｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../../assets/css/ability-detail-table.css">
  <link rel="stylesheet" href="../../assets/css/labyrinth.css">
  <link rel="stylesheet" href="../../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../../assets/css/game-tech.css?v=20261010b">
  <link rel="stylesheet" href="../../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../../assets/css/sidebar-drawer.css?v=20261011a">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>迷宮遺物資訊</h1>
      <p>查詢迷宮遺物效果與各類型／屬性可獲得的分數。</p>
    </section>

    <section class="controls">
      <label class="search-box">
        <span>搜尋遺物</span>
        <input id="artifactSearchInput" type="search" placeholder="輸入遺物名稱、效果、分類、類型或屬性...">
      </label>

      <label>
        <span>分類</span>
        <select id="artifactCategoryFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>
        <span>等級</span>
        <select id="artifactGradeFilter">
          <option value="">全部</option>
        </select>
      </label>

      <button id="artifactResetBtn" type="button">清除篩選</button>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="artifactResultCount">0</strong>
        <span>筆結果</span>
      </div>
    </section>

    <section class="layout modal-list-layout">
      <div id="artifactList" class="ability-list labyrinth-artifact-list"></div>
    </section>
  </main>

  <div id="artifactModal" class="modal-backdrop" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="artifactModalTitle">
      <button id="artifactModalCloseBtn" class="modal-close" type="button" aria-label="關閉遺物詳細資料">×</button>
      <div id="artifactModalContent"></div>
    </div>
  </div>

  <script src="../../assets/js/v2-data.js?v=20261013-v2.3"></script>
  <script src="../../assets/js/site.js?v=20261013-v2.3"></script>
  <script src="../../assets/js/labyrinth-artifact.js"></script>
</body>
</html>
