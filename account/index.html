<body class="gt-app" data-member-page="account">
<div id="site-header"></div>
<main class="page member-page"><div class="admin-shell">
  <section class="page-title member-banner"><p class="eyebrow member-banner-brand" lang="en">LINE Rangers Database</p><h1 data-i18n="member.security">隱私權與密碼</h1><p data-i18n="member.securityIntro">設定兩步驟驗證、帳號綁定及更改密碼</p></section>
  <div class="member-content member-narrow"><p id="memberState" class="admin-message" role="status" aria-live="polite" aria-atomic="true"></p><p id="memberLoginGate" hidden><a href="../login/" data-i18n="member.goLogin">前往登入</a></p><div id="memberSecurityArea" hidden><section class="admin-card" id="memberProof"><h2 data-i18n="member.reauth">驗證身分</h2><p id="memberProofStatus" class="member-proof-status" role="status"></p><form id="memberReauthForm" class="admin-form"><label><span data-i18n="member.password">密碼</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><button type="submit" data-i18n="member.confirm" >確認</button></form></section><section class="admin-card"><h2 data-i18n="member.securitySettings">帳號安全設定</h2><fieldset id="memberSettings" disabled><div id="memberGoogle" class="member-setting"><h3 data-i18n="member.google">Google 帳號綁定</h3><div class="admin-actions"><button type="button" id="memberGoogleStart" data-i18n="member.bindGoogle" >綁定 Google 帳號</button><button type="button" id="memberGoogleUnlink" data-i18n="member.unbindGoogle" hidden>解除 Google 綁定</button></div><p id="memberGoogleStatus"></p></div><div class="member-setting"><h3 data-i18n="member.twoFactor">兩步驟驗證（2FA）</h3><div class="admin-actions"><button type="button" id="memberSetup" data-i18n="member.setupTitle" >設定兩步驟驗證（2FA）</button><button type="button" id="memberDisable" data-i18n="member.disable" hidden>解除兩步驟驗證（2FA）</button><button type="button" id="memberCodes" data-i18n="member.regenerate" hidden>重新產生恢復碼</button></div><p id="memberFactorStatus"></p></div></fieldset></section><section class="admin-card" id="memberPassword"><h2 data-i18n="member.changePassword">變更密碼</h2><form id="memberPasswordForm" class="admin-form"><label><span data-i18n="member.currentPassword">目前密碼</span><input name="current_password" type="password" autocomplete="current-password" maxlength="128" required></label><label><span data-i18n="member.newPassword">新密碼（10–128 字元）</span><input name="new_password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label><span data-i18n="member.confirmPassword">確認新密碼</span><input name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><button type="submit" data-i18n="member.changePassword" >變更密碼</button></form></section><section class="admin-card" id="memberRecoveryPanel" hidden><h2 data-i18n="member.recoveryCodes">一次性恢復碼</h2><p data-i18n="member.saveCodes">恢復碼僅顯示一次，請離線妥善保存。重新整理後將無法再次查看。</p><pre id="memberRecovery"></pre><div class="admin-actions"><button type="button" id="memberCopyCodes" data-i18n="member.copyCodes" >複製恢復碼</button><button type="button" id="memberDownloadCodes" data-i18n="member.downloadCodes" >下載恢復碼</button><button type="button" id="memberHideCodes" data-i18n="member.saved" >已保存並關閉</button></div></section></div><dialog id="memberConfirmDialog" aria-labelledby="memberDialogTitle"><form id="memberConfirmForm" class="admin-form"><h2 id="memberDialogTitle"></h2><p id="memberDialogMessage"></p><div id="memberDialogFactor"><label><span data-i18n="member.totpCode">六位數驗證碼</span><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button type="button" id="memberDialogRecovery" data-i18n="member.useRecovery" >使用恢復碼</button></div><div class="admin-actions"><button type="button" id="memberDialogCancel" data-i18n="member.cancel" >取消</button><button type="submit" data-i18n="member.confirm" >確認</button></div></form></dialog></div>
