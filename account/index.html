<body class="gt-app"><div id="site-header"></div><main class="admin-page"><div class="admin-shell"><section class="admin-card"><h1 data-i18n="member.security">隱私權與密碼</h1><p id="memberState" role="status"></p><div class="admin-actions"><a href="../admin/" data-i18n="member.login">登入</a><button id="memberLogout" type="button" data-i18n="member.logout">登出</button></div></section><div id="memberSecurityArea" hidden><section class="admin-card" id="memberProof"><h2 data-i18n="member.reauth">再次驗證身分</h2><form id="memberReauthForm" class="admin-form"><label><span data-i18n="member.currentPassword">目前密碼</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><label><span data-i18n="member.code">驗證碼或恢復碼</span><input name="code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="64"></label><button type="submit" data-i18n="member.confirm">確認</button></form></section><section class="admin-card"><h2 data-i18n="member.twoFactor">兩步驟驗證（2FA）</h2><p id="memberFactorStatus"></p><form id="memberVerifyForm" class="admin-form" hidden><label><span data-i18n="member.code">驗證碼或恢復碼</span><input name="code" type="text" autocomplete="one-time-code" maxlength="64" required></label><button data-i18n="member.verify">驗證</button></form><div class="admin-actions"><button id="memberSetup" data-i18n="member.enable">啟用 2FA</button><button id="memberCodes" data-i18n="member.regenerate">重新產生恢復碼</button><button id="memberDisable" data-i18n="member.disable">停用 2FA</button></div><div id="memberSetupPanel" hidden><p data-i18n="member.scan">使用驗證器掃描，並輸入六位數驗證碼。</p><img id="memberQr" alt="Authenticator QR code" width="240" height="240"><p id="memberManualKey"></p><form id="memberEnableForm" class="admin-form"><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-label="TOTP"><button data-i18n="member.verify">驗證</button></form></div><div id="memberRecoveryPanel" hidden><p data-i18n="member.saveCodes">恢復碼僅顯示一次，請離線妥善保存。重新整理後將無法再次查看。</p><pre id="memberRecovery"></pre><button id="memberHideCodes" data-i18n="member.saved">已保存並關閉</button></div></section><section class="admin-card" id="memberGoogle"><h2 data-i18n="member.google">Google 帳號綁定</h2><p data-i18n="member.googleGuide">已驗證的 Gmail 將用於帳號救援。</p><p id="memberGoogleStatus"></p><div class="admin-actions"><button id="memberGoogleStart" data-i18n="member.bind">綁定／更換 Google 帳號</button><button id="memberGoogleUnlink" data-i18n="member.unbind">解除綁定</button></div></section><div class="admin-card" id="memberPassword">      <section id="adminPasswordCard" class="admin-workspace-panel">
        <h2>變更自己的密碼</h2>
        <p class="admin-muted">所有管理員階級都可以隨時變更自己的登入密碼。更新成功後，其他裝置上的登入狀態會立即失效。</p>
        <form id="adminPasswordForm" class="admin-form" autocomplete="on">
          <label>
            <span>目前密碼</span>
            <input id="adminCurrentPassword" type="password" autocomplete="current-password" maxlength="128" required>
          </label>
          <label>
            <span>新密碼</span>
            <input id="adminNewPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          </label>
          <label>
            <span>確認新密碼</span>
            <input id="adminNewPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          </label>
          <div class="admin-actions">
            <button id="adminPasswordSubmit" class="primary" type="submit">更新密碼</button>
          </div>
        </form>
        <div id="adminPasswordMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>


</div><section class="admin-card" id="memberApplication"><button id="memberApply" data-i18n="member.apply">提出管理員申請</button></section></div></div></main>
