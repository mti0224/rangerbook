<body class="gt-app" data-member-page="register">
<div id="site-header"></div>
<main class="page member-page"><div class="admin-shell">
  <section class="page-title member-banner"><p class="eyebrow member-banner-brand" lang="en">LINE Rangers Database</p><h1 data-i18n="member.registerTitle">註冊</h1><p data-i18n="member.registerIntro">註冊帳號</p></section>
  <div class="member-content member-narrow"><section class="admin-card"><p id="memberState" class="admin-message" role="status" aria-live="polite" aria-atomic="true"></p><form id="adminRegisterForm" class="admin-form"><label><span data-i18n="member.account">帳號</span><input name="account" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" required></label><label><span data-i18n="member.email">Email</span><input name="email" type="email" autocomplete="email" maxlength="254" required></label><label><span data-i18n="member.newPassword">新密碼（10–128 字元）</span><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><label><span data-i18n="member.confirmPassword">確認新密碼</span><input name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label><p class="admin-muted" data-i18n="member.passwordRules">密碼長度須為 10–128 字元。</p><div id="memberCaptcha"></div><button type="submit" data-i18n="member.registerTitle" >註冊</button></form></section><section id="memberRegistrationSent" class="admin-card" hidden><h2 data-i18n="member.mailSent">請檢查你的信箱</h2><p data-i18n="member.registrationSent">若資料可用，驗證信已寄出。連結有效 15 分鐘，請檢查垃圾郵件，完成驗證後再登入。</p><button type="button" id="memberRegistrationResend" data-i18n="member.resend" >重寄驗證信</button><div class="member-links"><a href="../login/" data-i18n="member.login">登入</a></div><p id="memberResendStatus" role="status" aria-live="polite"></p></section></div>
