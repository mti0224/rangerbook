<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PvP 排行榜｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/home.css">
  <link rel="stylesheet" href="../../assets/css/pvp-data.css">
  <link rel="stylesheet" href="../../assets/css/pvp-table-status.css?v=20260720-2">
  <link rel="stylesheet" href="../../assets/css/pvp-level-badge.css?v=20260720-1">
  <link rel="stylesheet" href="../../assets/css/pvp-player-teams.css?v=20260724-1">
  <link rel="stylesheet" href="../../assets/css/pvp-player-detail-layout.css?v=20260722-1">
</head>
<body data-pvp-page="leaderboard">
  <div id="site-header"></div>

  <main class="page pvp-data-page">
    <section class="page-title">
      <p class="eyebrow">PvP · LEGEND</p>
      <h1>傳奇段位排行榜</h1>
      <p>顯示目前傳奇段位玩家的排名與 PvP 分數。點擊玩家可查看隊伍 1～5 與 PvP 防守隊伍。</p>
    </section>

    <section class="pvp-data-meta" aria-label="排行榜資料摘要">
      <div class="pvp-meta-item"><span>資料更新時間</span><strong id="pvpLeaderboardUpdated">-</strong></div>
      <div class="pvp-meta-item"><span>段位</span><strong id="pvpLeaderboardLeague">LEGEND</strong></div>
      <div class="pvp-meta-item"><span>排行榜收錄總人數</span><strong><span id="pvpLeaderboardCount">-</span></strong></div>
      <div class="pvp-meta-item"><span>段位總人數</span><strong><span id="pvpLeaderboardTotal">-</span></strong></div>
    </section>

    <section class="pvp-data-controls" aria-label="排行榜篩選">
      <label>
        <span>段位</span>
        <select id="pvpLeagueSelect"><option value="LEGEND">傳奇</option></select>
      </label>
      <label>
        <span>搜尋玩家</span>
        <input id="pvpLeaderboardSearch" type="search" placeholder="玩家名稱、排名、分數或國家代碼">
      </label>
    </section>

    <section class="pvp-data-panel">
      <div id="pvpLeaderboardStatus" class="pvp-status">排行榜資料載入中…</div>
      <div class="pvp-table-scroll">
        <table class="pvp-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>玩家</th>
              <th>分數</th>
              <th>國家/地區</th>
            </tr>
          </thead>
          <tbody id="pvpLeaderboardBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="pvpPlayerTeamModal" class="pvp-usage-modal" hidden>
    <div class="pvp-usage-modal-backdrop" data-pvp-player-modal-close></div>
    <section class="pvp-usage-modal-panel pvp-player-team-modal-panel" role="dialog" aria-modal="true" aria-labelledby="pvpPlayerTeamModalTitle">
      <button id="pvpPlayerTeamModalClose" class="pvp-usage-modal-close" type="button" aria-label="關閉">×</button>
      <div id="pvpPlayerTeamModalContent"></div>
    </section>
  </div>

  <script src="../../assets/js/site.js"></script>
  <script src="../../assets/js/pvp-league-switcher.js?v=20260723-1" defer></script>
  <script src="../../assets/js/pvp-leaderboard.js?v=20260722-2" defer></script>
  <script src="../../assets/js/pvp-player-detail-layout.js?v=20260722-2" defer></script>
  <script src="../../assets/js/pvp-team-talent-icons.js?v=20260724-1" defer></script>
</body>
</html>
