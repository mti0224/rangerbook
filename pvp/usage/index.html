<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PvP 角色使用率｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/home.css">
  <link rel="stylesheet" href="../../assets/css/pvp-data.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page pvp-data-page">
    <section class="page-title">
      <p class="eyebrow">PvP · LEGEND</p>
      <h1>角色使用率</h1>
      <p>統計傳奇段位排行榜玩家 PvP 防守隊伍中的角色使用比例。</p>
    </section>

    <section class="pvp-data-meta" aria-label="角色使用率資料摘要">
      <div class="pvp-meta-item"><span>資料更新時間</span><strong id="pvpUsageUpdated">-</strong></div>
      <div class="pvp-meta-item"><span>段位</span><strong id="pvpUsageLeague">LEGEND</strong></div>
      <div class="pvp-meta-item"><span>有效玩家樣本</span><strong><span id="pvpUsageSampleCount">-</span> 人</strong></div>
      <div class="pvp-meta-item"><span>排行榜玩家數</span><strong><span id="pvpUsageRankingCount">-</span> 人</strong></div>
    </section>

    <section class="pvp-data-controls" aria-label="角色使用率篩選">
      <label>
        <span>搜尋角色</span>
        <input id="pvpUsageSearch" type="search" placeholder="角色名稱或 ID">
      </label>
      <label>
        <span>類型</span>
        <select id="pvpUsageType"><option value="">全部類型</option></select>
      </label>
      <label>
        <span>屬性</span>
        <select id="pvpUsageElement"><option value="">全部屬性</option></select>
      </label>
    </section>

    <section class="pvp-data-panel">
      <div id="pvpUsageStatus" class="pvp-status">角色使用率資料載入中…</div>
      <div class="pvp-table-scroll">
        <table class="pvp-table">
          <thead>
            <tr>
              <th>排名</th>
              <th>角色</th>
              <th>使用玩家數</th>
              <th>使用率</th>
              <th>出場次數</th>
            </tr>
          </thead>
          <tbody id="pvpUsageBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../../assets/js/site.js"></script>
  <script src="../../assets/js/pvp-usage.js" defer></script>
</body>
</html>
