<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      const root = location.pathname.startsWith("/rangerbook/") ? "/rangerbook/" : "/";
      document.write('<script src="' + root + 'assets/js/visitor-region.js?v=20261013-region1"><\/script>');
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PvP｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/ranger-compare.css">
  <link rel="stylesheet" href="../assets/css/hub-entry.css?v=20260919-1">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261013b">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>PvP</h1>
      <p>查看傳奇段位排行榜、角色使用率與每日使用次數變化。</p>
    </section>

    <section class="ranger-hub-grid" aria-label="PvP 功能入口">
      <a class="ranger-hub-card" href="./leaderboard/">
        <div>
          <h2>排行榜</h2>
          <p>查看傳奇段位玩家目前排名與 PvP 分數。</p>
        </div>
      </a>

      <a class="ranger-hub-card" href="./usage/">
        <div>
          <h2>角色使用率</h2>
          <p>查看傳奇段位 PvP 防守隊伍角色使用率統計。</p>
        </div>
      </a>

      <a class="ranger-hub-card" href="./usage-history/">
        <div>
          <h2>角色使用率變化</h2>
          <p>以每日使用次數折線圖比較傳奇段位角色的變化。</p>
        </div>
      </a>

      <a id="pvpPlayerSearchEntry" class="ranger-hub-card" href="./search/" hidden>
        <div>
          <h2>查詢玩家隊伍</h2>
          <p>依玩家名稱搜尋並即時查看隊伍配置。</p>
        </div>
      </a>
    </section>
  </main>

  <script src="../assets/js/v2-data.js?v=20261013-region1"></script>
  <script src="../assets/js/site.js?v=20261013-region1"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script>
    (() => {
      const auth = window.RangerbookAuth;
      const entry = document.getElementById("pvpPlayerSearchEntry");
      if (!auth || !entry) return;
      auth.ready().then(() => {
        entry.hidden = !auth.isSuperAdmin();
      });
      window.addEventListener("rangerbook:auth-changed", () => {
        entry.hidden = !auth.isSuperAdmin();
      });
    })();
  </script>
</body>
</html>
