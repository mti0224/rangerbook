<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      let saved;try {saved=localStorage.getItem("rangerbook-language");} catch (_) {}
      saved=({zh_TW:"zh-Hant",ja:"jp"})[saved] || saved;
      if (!["zh-Hant","en","th","jp"].includes(saved))
        saved=document.cookie.split("; ").find(x=>x.startsWith("rangerbook-language="))?.split("=")[1];
      const locale=["zh-Hant","en","th","jp"].includes(saved)?saved:"zh-Hant";
      document.documentElement.lang=locale==="jp"?"ja":locale;
      if(locale!=="zh-Hant")document.documentElement.dataset.rbLocalizing="true";
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無限之塔｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/ranger.css">
  <link rel="stylesheet" href="../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../assets/css/ranger-pagination.css">
  <link rel="stylesheet" href="../assets/css/hsEnemy.css">
  <link rel="stylesheet" href="../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../assets/css/infEnemy.css">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261010b">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261011a">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>無限之塔</h1>
      <p>
        查詢無限之塔敵人的詳細數據。
      </p>
    </section>

    <section class="controls ranger-controls">
      <label class="search-box">
        <span>搜尋敵人</span>
        <input id="enemySearchInput" type="search" placeholder="輸入敵人 ID、類型、屬性、技能或能力...">
      </label>

      <label>
        <span>能力</span>
        <select id="abilityFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>
        <span>類型</span>
        <select id="typeFilter">
          <option value="">全部</option>
        </select>
      </label>

      <label>
        <span>屬性</span>
        <select id="elementFilter">
          <option value="">全部</option>
        </select>
      </label>

      <button id="enemyResetBtn" type="button">清除篩選</button>
    </section>

    <section class="summary-bar">
      <div>
        <strong id="enemyResultCount">0</strong>
        <span>筆結果</span>
      </div>
    </section>

    <section class="ranger-list-layout">
      <div id="enemyList" class="ranger-list"></div>
    </section>
  </main>

  <div id="enemyModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="enemyModalTitle">
      <button id="enemyModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="enemyModalContent"></div>
    </div>
  </div>

  <script src="../assets/js/v2-data.js?v=20261013-v2.4"></script>
  <script src="../assets/js/site.js?v=20261013-v2.4"></script>
  <script>
    window.__originalFetchForInfEnemy = window.fetch.bind(window);
    window.fetch = (resource, options) => {
      const url = String(resource);
      if (url.includes("hsEnemy_data.json")) {
        return window.__originalFetchForInfEnemy("../res/infEnemy_data.json", options);
      }
      return window.__originalFetchForInfEnemy(resource, options);
    };
  </script>
  <script src="../assets/js/hsEnemy.js?v=20261013-v2.4"></script>
  <script src="../assets/js/hsEnemy-skill-meta-table.js?v=20261013-v2.4"></script>
  <script src="../assets/js/infEnemy-boss-tag.js"></script>
  <script src="../assets/js/card-tag-colors.js"></script>
  <script src="../assets/js/bottom-pagination.js"></script>
</body>
</html>
