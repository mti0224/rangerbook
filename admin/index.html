<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script src="../assets/js/pwa-head.js"></script>

  <script>
    (() => {
      const root = location.pathname.startsWith("/rangerbook/") ? "/rangerbook/" : "/";
      document.write('<script src="' + root + 'assets/js/visitor-region.js?v=20261013-region1"><\/script>');
    })();
  </script>
  <style>html[data-rb-localizing] body{visibility:hidden}html[data-rb-localizing]::after{content:"Loading…";position:fixed;inset:45% 0;text-align:center;font:16px sans-serif}</style>

  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>管理員｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css?v=20261025-accounts-table1">
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261013-v2.5">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
  <link rel="stylesheet" href="../assets/css/sidebar-drawer.css?v=20261014-toggle1">
</head>
<body class="gt-app">
  <div id="site-header"></div>

  <main class="page admin-console-page">
    <div class="admin-shell">
      <section id="adminAuthCard" class="admin-card">
        <h1>管理員登入</h1>
        <p class="admin-muted">此頁面不會出現在公開導覽列。帳號驗證與權限判定由 Rangerbook AWS 後端處理。</p>

        <div class="admin-tabs" role="tablist" aria-label="管理員帳號操作">
          <button id="adminLoginTab" class="active" type="button">登入</button>
          <button id="adminRegisterTab" type="button">註冊帳號</button>
        </div>

        <div id="adminLoginPanel">
          <form id="adminLoginForm" class="admin-form" autocomplete="on">
            <label>
              <span>帳號</span>
              <input id="adminLoginAccount" type="text" autocomplete="username" minlength="3" maxlength="32" required>
            </label>
            <label>
              <span>密碼</span>
              <input id="adminLoginPassword" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
            </label>
            <div class="admin-actions">
              <button class="primary" type="submit">登入</button>
              <a href="../forgot-password/" data-i18n="member.forgot">忘記密碼</a>
            </div>
          </form>
        </div>

        <div id="adminRegisterPanel" hidden>
          <form id="adminRegisterForm" class="admin-form" autocomplete="on">
            <label>
              <span>帳號</span>
              <input id="adminRegisterAccount" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
            </label>
            <label>
              <span>密碼</span>
              <input id="adminRegisterPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
            </label>
            <label>
              <span>確認密碼</span>
              <input id="adminRegisterPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
            </label>
            <label><span data-i18n="member.email">Email</span><input id="adminRegisterEmail" type="email" autocomplete="email" maxlength="254" required></label><div id="memberCaptcha"></div><p data-i18n="member.registerGuide">完成 Email 驗證後啟用一般會員；管理員申請須另外提出。</p>
            <div class="admin-actions">
              <button class="primary" type="submit" data-i18n="member.register">註冊帳號</button>
            </div>
          </form>
        </div>

        <p id="memberLoginStep" hidden><a href="../login/" data-i18n="member.continue2fa">繼續兩步驟驗證</a></p><div id="adminAuthMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>

      <section id="adminSessionCard" class="admin-card" hidden>
        <div class="admin-session-head">
          <div>
            <p class="eyebrow">目前登入</p>
            <h1 id="adminCurrentAccount">-</h1>
            <div class="admin-actions">
              <span id="adminCurrentRole" class="admin-role-badge">-</span>
              <span id="adminCurrentStatus" class="admin-status-badge">-</span>
            </div>
          </div>
        </div>
        <div id="adminSessionMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>

      <div id="adminWorkspace" class="admin-card admin-workspace" hidden>
        <div id="adminWorkspaceTabs" class="admin-workspace-tabs" role="tablist" aria-label="管理員功能分頁">
          <button id="adminResourcesTab" type="button" role="tab" data-admin-section="resources" aria-controls="adminResourceUpdatesCard" aria-selected="false" tabindex="-1">數據更新追蹤</button>
          <button id="adminTrafficTab" type="button" role="tab" data-admin-section="traffic" aria-controls="adminTrafficPanel" aria-selected="false" tabindex="-1" hidden>網站流量</button>
          <button id="adminAccountsTab" type="button" role="tab" data-admin-section="accounts" aria-controls="superAdminPanel" aria-selected="false" tabindex="-1" hidden>帳號管理</button>
        </div>

      <section id="adminResourceUpdatesCard" class="admin-workspace-panel" role="tabpanel" aria-labelledby="adminResourcesTab" tabindex="0" hidden>
        <div class="admin-session-head">
          <div>
            <p class="eyebrow">Resource Monitor</p>
            <h2>遊戲更新檔案</h2>
                      </div>
          <div class="admin-actions">
            <button id="adminResourceUpdatesRefreshBtn" class="secondary" type="button">重新整理</button>
          </div>
        </div>
        <div id="adminResourceUpdatesSummary" class="admin-update-summary">載入中…</div>
        <div id="adminResourceUpdatesList" class="admin-update-list"></div>
      </section>


      <section id="superAdminPanel" class="admin-workspace-panel" role="tabpanel" aria-labelledby="adminAccountsTab" tabindex="0" hidden>
        <div class="admin-session-head">
          <div>
            <p class="eyebrow">Super Admin</p>
            <h2>帳號管理</h2>
            <p class="admin-muted">搜尋帳號、調整權限及管理密碼。註冊完成電子郵件驗證即可啟用，不需人工審核。</p>
          </div>
          <div class="admin-actions">
            <button id="adminRefreshBtn" class="secondary" type="button">重新整理</button>
          </div>
        </div>

        <div class="admin-account-scroll" tabindex="0" role="region" aria-label="帳號管理表格，可左右捲動">
        <div class="admin-account-content">
        <div id="adminAccountSummary" class="admin-account-summary"></div>
        <div class="admin-account-toolbar">
          <label class="admin-account-search"><span>搜尋帳號</span><input id="adminAccountSearch" type="search" maxlength="64" autocomplete="off" placeholder="輸入帳號名稱"></label>
          <label><span>帳號權限</span><select id="adminAccountRole"><option value="all">所有權限</option><option value="user">一般會員</option><option value="admin">管理員</option><option value="super_admin">最大管理者</option></select></label>
          <label><span>密碼狀態</span><select id="adminAccountPassword"><option value="all">所有狀態</option><option value="required">須更改密碼</option><option value="normal">無須更改</option></select></label>
          <label><span>排序方式</span><select id="adminAccountSort"><option value="role">依權限排序</option><option value="name">依帳號名稱</option><option value="newest">最新建立優先</option><option value="oldest">最早建立優先</option></select></label>
        </div>
        <div class="admin-account-list-heading"><h3>帳號清單</h3><button id="adminAccountClear" class="admin-text-button" type="button">清除篩選</button></div>
        <p id="adminAccountResults" class="admin-muted" role="status" aria-live="polite"></p>
        <div id="adminUsersList" class="admin-user-list" aria-busy="false"></div>
        </div>
        </div>
        <nav class="admin-account-pagination" aria-label="帳號清單分頁">
          <button id="adminAccountPrevious" class="secondary" type="button">上一頁</button>
          <span id="adminAccountPage" aria-live="polite"></span>
          <button id="adminAccountNext" class="secondary" type="button">下一頁</button>
        </nav>
      </section>

        <section id="adminTrafficPanel" class="admin-workspace-panel" role="tabpanel" aria-labelledby="adminTrafficTab" tabindex="0" hidden>
          <h2>網站流量</h2>
          <div class="traffic-toolbar">
            <label class="traffic-range" for="trafficDays">時間範圍
              <select id="trafficDays"><option value="7">最近 7 天</option><option value="30" selected>最近 30 天</option><option value="90">最近 90 天</option></select>
            </label>
            <button id="trafficRefresh" type="button">重新整理</button>
          </div>
          <p id="trafficStatus" aria-live="polite"></p>
          <div id="trafficSummary" class="traffic-metrics"></div>
          <section class="traffic-chart-card" aria-labelledby="trafficDailyHeading">
            <h3 id="trafficDailyHeading">每日瀏覽次數</h3>
            <div id="trafficDaily" class="traffic-chart-scroll" aria-live="polite"></div>
          </section>
          <section class="traffic-chart-card" aria-labelledby="trafficPagesHeading">
            <h3 id="trafficPagesHeading">熱門頁面</h3>
            <div id="trafficPages" class="traffic-scroll-list" aria-live="polite"></div>
          </section>
          <section class="traffic-chart-card" aria-labelledby="trafficSourcesHeading">
            <h3 id="trafficSourcesHeading">流量來源</h3>
            <div id="trafficSources" class="traffic-source-chart" aria-live="polite"></div>
          </section>
        </section>
      </div>

    </div>
  </main>

  <script src="../assets/js/v2-data.js?v=20261018-distbars2"></script>
  <script src="../assets/js/site.js?v=20261018-distbars2"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-traffic-charts.js?v=20261013-v2.5"></script>
  <script src="../assets/js/admin-page.js?v=20261025-accounts-table1"></script>
<script src="../assets/js/member-registration.js"></script>
</body>
</html>
