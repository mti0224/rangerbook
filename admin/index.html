<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理員｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="admin-page">
    <div class="admin-shell">
      <section id="adminAuthCard" class="admin-card">
        <h1>管理員登入</h1>
        <p class="admin-muted">此頁面不會出現在公開導覽列。帳號驗證與權限判定由 Rangerbook AWS 後端處理。</p>

        <div class="admin-tabs" role="tablist" aria-label="管理員帳號操作">
          <button id="adminLoginTab" class="active" type="button">登入</button>
          <button id="adminRegisterTab" type="button">註冊帳號</button>
        </div>

        <div id="adminLoginPanel">
          <form id="adminLoginForm" class="admin-form" autocomplete="on">
            <label>
              <span>帳號</span>
              <input id="adminLoginAccount" type="text" autocomplete="username" minlength="3" maxlength="32" required>
            </label>
            <label>
              <span>密碼</span>
              <input id="adminLoginPassword" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
            </label>
            <div class="admin-actions">
              <button class="primary" type="submit">登入</button>
              <a href="../">回首頁</a>
            </div>
          </form>
        </div>

        <div id="adminRegisterPanel" hidden>
          <form id="adminRegisterForm" class="admin-form" autocomplete="on">
            <label>
              <span>帳號</span>
              <input id="adminRegisterAccount" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
            </label>
            <label>
              <span>密碼</span>
              <input id="adminRegisterPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
            </label>
            <label>
              <span>確認密碼</span>
              <input id="adminRegisterPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
            </label>
            <div class="admin-warning">註冊完成後會建立非管理員帳號並送出管理員申請。只有最大管理者核准後，才會取得目前的 admin 隱藏資料檢視權限。</div>
            <div class="admin-actions">
              <button class="primary" type="submit">註冊並送出申請</button>
            </div>
          </form>
        </div>

        <div id="adminAuthMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>

      <section id="adminSessionCard" class="admin-card" hidden>
        <div class="admin-session-head">
          <div>
            <p class="eyebrow">目前登入</p>
            <h1 id="adminCurrentAccount">-</h1>
            <div class="admin-actions">
              <span id="adminCurrentRole" class="admin-role-badge">-</span>
              <span id="adminCurrentStatus" class="admin-status-badge">-</span>
            </div>
          </div>
          <div class="admin-actions">
            <a href="../">回首頁</a>
            <button id="adminLogoutBtn" class="secondary" type="button">登出</button>
          </div>
        </div>
        <div id="adminSessionMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>

      <section id="adminPasswordCard" class="admin-card" hidden>
        <h2>變更自己的密碼</h2>
        <p class="admin-muted">所有管理員階級都可以隨時變更自己的登入密碼。更新成功後，其他裝置上的登入狀態會立即失效。</p>
        <form id="adminPasswordForm" class="admin-form" autocomplete="on">
          <label>
            <span>目前密碼</span>
            <input id="adminCurrentPassword" type="password" autocomplete="current-password" maxlength="128" required>
          </label>
          <label>
            <span>新密碼</span>
            <input id="adminNewPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          </label>
          <label>
            <span>確認新密碼</span>
            <input id="adminNewPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
          </label>
          <div class="admin-actions">
            <button id="adminPasswordSubmit" class="primary" type="submit">更新密碼</button>
          </div>
        </form>
        <div id="adminPasswordMessage" class="admin-message" role="status" aria-live="polite"></div>
      </section>

      <section id="superAdminPanel" class="admin-card" hidden>
        <div class="admin-session-head">
          <div>
            <p class="eyebrow">Super Admin</p>
            <h2>最大管理者面板</h2>
            <p class="admin-muted">核准或拒絕管理員申請，並可管理帳號權限、重置密碼與刪除帳號。最大管理者帳號本身只能由伺服器端管理。</p>
          </div>
          <div class="admin-actions">
            <button id="adminRefreshBtn" class="secondary" type="button">重新整理</button>
          </div>
        </div>

        <div class="admin-grid">
          <section>
            <h3>待審核申請</h3>
            <div id="adminApplicationsList" class="admin-user-list"></div>
          </section>
          <section>
            <h3>使用者與權限</h3>
            <div id="adminUsersList" class="admin-user-list"></div>
          </section>
        </div>
      </section>
    </div>
  </main>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script src="../assets/js/admin-page.js"></script>
  <script src="../assets/js/admin-password.js?v=20260724-1"></script>
</body>
</html>
