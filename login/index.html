  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>

<body class="gt-app" data-member-page="login">
<div id="site-header"></div>
<main class="admin-page member-page"><div class="admin-shell">
  <section class="page-title member-banner"><span class="member-banner-brand" lang="en">LINE RANGERS DATABASE</span><h1 data-i18n="member.login">登入</h1><p data-i18n="member.loginIntro">登入帳號</p></section>
  <div class="member-content member-narrow"><p id="memberState" class="admin-message" role="status" aria-live="polite" aria-atomic="true"></p><section id="memberLoginCard" class="admin-card"><form id="memberLoginForm" class="admin-form"><label><span data-i18n="member.account">帳號</span><input name="account" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]{3,32}" required></label><label><span data-i18n="member.password">密碼</span><input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><div class="member-login-actions"><div class="member-login-links"><a href="../forgot-password/" data-i18n="member.forgotTitle">忘記密碼？</a><a href="../register/" data-i18n="member.noAccount">還沒有帳號？</a></div><button type="submit" data-i18n="member.login">登入</button></div></form></section>
<section id="memberLoginFactor" class="admin-card" hidden><h2 data-i18n="member.twoFactor">兩步驟驗證（2FA）</h2><form id="memberLoginFactorForm" class="admin-form"><label><span data-i18n="member.totpCode">六位數驗證碼</span><input name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button type="submit" data-i18n="member.confirm" >確認</button> <button type="button" id="memberUseRecovery" data-i18n="member.useRecovery" >使用恢復碼</button></form></section></div>
