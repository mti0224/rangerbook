[logging]
log_level = "NONE"
log_to_file = false

[capabilities.secrets_manager]
enabled = true
http_port = 2773
region = "ap-south-1"
max_conn = 10

[capabilities.secrets_manager.cache]
ttl_seconds = 300
cache_size = 2

[capabilities.secrets_manager.security]
ssrf_headers = ["X-Aws-Parameters-Secrets-Token"]
ssrf_env_variables = ["AWS_TOKEN"]
