<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>極限模式關卡資訊｜LINE Rangers Database</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/ranger.css">
  <link rel="stylesheet" href="../../assets/css/ranger-ability-effect-merge.css">
  <link rel="stylesheet" href="../../assets/css/hsEnemy.css">
  <link rel="stylesheet" href="../../assets/css/card-tag-colors.css">
  <link rel="stylesheet" href="../../assets/css/endless.css">
  <link rel="stylesheet" href="../../assets/css/hs-stage.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page ranger-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>極限模式關卡資訊</h1>
      <p>選擇關卡後查看該關卡的敵人生產線資訊。</p>
    </section>

    <section id="hsStageGrid" class="endless-stage-grid" aria-label="極限模式關卡選擇"></section>

    <section id="hsStageDetail" hidden>
      <div class="endless-stage-head">
        <h2 id="hsStageTitle" class="endless-stage-title"></h2>
        <a class="endless-back-link" href="../stage/">返回關卡選擇</a>
      </div>
      <div id="hsStageConditions"></div>
    </section>
  </main>

  <div id="hsEnemyLineModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="hsEnemyLineModalTitle">
      <button id="hsEnemyLineModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="hsEnemyLineModalContent"></div>
    </div>
  </div>

  <script src="../../assets/js/site.js"></script>
  <script>
    (() => {
      const ROOT = window.location.pathname.includes('/rangerbook/') ? '/rangerbook/' : '/';
      const originalFetch = window.fetch.bind(window);
      const HARD_STAGE_ENCODED = '%E5%9B%B0%E9%9B%A3%E9%97%9C%E5%8D%A1%E7%94%9F%E7%94%A2%E7%B7%9A.json';
      const EXTREME_STAGE_ENCODED = '%E6%A5%B5%E9%99%90%E9%97%9C%E5%8D%A1%E7%94%9F%E7%94%A2%E7%B7%9A.json';

      window.fetch = function (resource, options) {
        const url = String(resource);
        if (url.includes(HARD_STAGE_ENCODED) || url.includes('困難關卡生產線.json')) {
          return originalFetch(`${ROOT}res/${EXTREME_STAGE_ENCODED}`, options);
        }
        if (url.includes('res/hsEnemy_data.json')) {
          return originalFetch(`${ROOT}res/extremeEnemy_data.json`, options);
        }
        return originalFetch(resource, options);
      };

      function patchExtremeStageUi() {
        document.querySelectorAll('#hsStageGrid .endless-stage-card').forEach((card) => {
          const no = Number(card.dataset.stageNo || 0);
          if (!no) return;
          card.href = `?stage=hs${String(no).padStart(3, '0')}`;
        });

        const title = document.getElementById('hsStageTitle');
        if (title && title.textContent.includes('困難關卡')) {
          title.textContent = title.textContent.replace('困難關卡', '極限模式');
        }

        document.querySelectorAll('.empty-state').forEach((node) => {
          if (node.textContent.includes('困難關卡')) {
            node.textContent = node.textContent
              .replaceAll('困難關卡生產線.json', '極限關卡生產線.json')
              .replaceAll('困難關卡', '極限模式');
          }
        });
      }

      const observer = new MutationObserver(patchExtremeStageUi);
      observer.observe(document.documentElement, {
        childList: true,
        subtree: true,
        characterData: true
      });
      document.addEventListener('DOMContentLoaded', patchExtremeStageUi);
    })();
  </script>
  <script src="../../assets/js/hs-stage.js"></script>
  <script src="../../assets/js/card-tag-colors.js"></script>
</body>
</html>
