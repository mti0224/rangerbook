<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <script>
    // Apply the saved theme before any stylesheet can paint the page.
    try {
      const theme = localStorage.getItem("rangerbook-theme");
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公會｜LINE Rangers Database</title>
  <link rel="icon" type="image/png" href="../assets/main_icon/icon.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/home.css">
  <link rel="stylesheet" href="../assets/css/ranger-compare.css">
  <link rel="stylesheet" href="../assets/css/hub-entry.css">
  <style>.admin-only-entry[hidden]{display:none!important}</style>
  <link rel="stylesheet" href="../assets/css/header-responsive.css?v=20260429c">
  <link rel="stylesheet" href="../assets/css/mobile-interaction-fix.css?v=20260430c">
  <link rel="stylesheet" href="../assets/css/theme-toggle.css?v=20260525a">
  <link rel="stylesheet" href="../assets/css/game-tech.css?v=20261010b">
  <link rel="stylesheet" href="../assets/css/game-tech-controls.css?v=20261010a">
</head>
<body class="gt-app">
  <div id="site-header"></div>
  <main class="page home-page">
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>公會</h1>
      <p>查看公會戰排名與高排名公會玩家的公會戰進攻角色使用率。</p>
    </section>
    <section class="ranger-hub-grid" aria-label="公會功能入口">
      <a class="ranger-hub-card" href="./ranking/"><div><h2>公會排名</h2><p>查看目前公會戰排行榜的傳奇公會。</p></div></a>
      <a id="guildwarUsageEntry" class="ranger-hub-card admin-only-entry" href="./usage/" hidden><div><h2>角色使用率</h2><p>查看傳奇公會成員保存的公會戰進攻角色使用率。</p></div></a>
    </section>
  </main>
  <script src="../assets/js/v2-data.js?v=20261012"></script>
  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script>
    (() => {
      const auth = window.RangerbookAuth;
      const usageEntry = document.getElementById("guildwarUsageEntry");
      if (!auth || !usageEntry) return;

      function updateUsageEntryVisibility() {
        usageEntry.hidden = !auth.isAdmin();
      }

      window.addEventListener("rangerbook:auth-changed", updateUsageEntryVisibility);
      auth.ready().then(updateUsageEntryVisibility);
    })();
  </script>
</body>
</html>
