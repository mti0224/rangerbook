<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE Rangers 資料查詢</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/home.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="hero">
      <p class="eyebrow">LINE Rangers Reference</p>
      <h1>LINE Rangers 資料查詢工具</h1>
      <p class="hero-text">
        提供整理後的 LINE Rangers 遊戲資料查詢介面。你可以快速查詢 Rangers 角色、主要困難關卡敵人、能力效果、觸發條件與相關數值，
        未來也會陸續加入更多資料分類。
      </p>
    </section>

    <section class="home-tool-grid" aria-label="資料查詢入口">
      <a class="home-tool-card" href="./ranger/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/rangerIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>Rangers角色查詢</h2>
          <p>查詢 Rangers 角色的基本資料、能力數值、技能效果、能力與才能資訊。</p>
        </div>
      </a>

      <a class="home-tool-card" href="./ability/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/abilityIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>能力查詢</h2>
          <p>查詢能力名稱、敘述、能力分類、觸發時機、條件與效果。</p>
        </div>
      </a>

      <a class="home-tool-card" href="./hsEnemy/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/hsIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>主要困難關卡敵人查詢</h2>
          <p>查詢主要困難關卡敵人的基本數值、技能效果與能力資訊。</p>
        </div>
      </a>
    </section>
  </main>

  <script src="./assets/js/site.js"></script>
</body>
</html>
