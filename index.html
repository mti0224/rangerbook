<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE Rangers Database</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/home.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="hero">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>LINE Rangers 資料庫</h1>
      <p class="hero-text">
        提供 LINE Rangers 的角色、能力與主要困難關卡敵人資料查詢，方便快速查看各項詳細數據。
      </p>
    </section>

    <section class="home-tool-grid" aria-label="資料查詢入口">
      <a class="home-tool-card" href="./ranger/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/rangerIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>Rangers角色</h2>
          <p>查詢每隻角色的詳細數據</p>
        </div>
      </a>

      <a class="home-tool-card" href="./ability/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/abilityIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>能力</h2>
          <p>查詢能力的詳細數據</p>
        </div>
      </a>

      <a class="home-tool-card" href="./hsEnemy/">
        <div class="home-tool-image-wrap">
          <img class="home-tool-image" src="./assets/main_icon/hsIcon.png" alt="" loading="lazy">
        </div>
        <div class="home-tool-content">
          <h2>主困敵人</h2>
          <p>查詢主要困難關卡中敵人的詳細數據</p>
        </div>
      </a>
    </section>
  </main>

  <script src="./assets/js/site.js"></script>
</body>
</html>
