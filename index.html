<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE Rangers 資料查詢</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="hero">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>LINE Rangers 資料查詢工具</h1>
      <p class="hero-text">
        這裡會逐步整理各類 LINE Rangers 資料查詢功能。資料檔案統一放在 <code>/res</code> 資料夾，
        之後新增其他資料查詢頁時，可以沿用同一套網站架構與 Header。
      </p>
      <div class="hero-actions">
        <a class="primary-btn" href="./ability/">前往能力查詢</a>
      </div>
    </section>

    <section class="tool-grid">
      <a class="tool-card" href="./ability/">
        <div class="tool-icon">能力</div>
        <div>
          <h2>能力數值查詢</h2>
          <p>查詢能力名稱、代碼、敘述、覺醒能力與各組觸發效果。</p>
        </div>
      </a>

      <div class="tool-card disabled">
        <div class="tool-icon">角色</div>
        <div>
          <h2>角色資料查詢</h2>
          <p>預留區塊，之後可新增角色、裝備、技能或轉蛋資料查詢。</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./assets/js/site.js"></script>
</body>
</html>
