<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE Rangers 資料查詢</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page home-page">
    <section class="hero">
      <p class="eyebrow">LINE Rangers Reference</p>
      <h1>LINE Rangers 資料查詢工具</h1>
      <p class="hero-text">
        提供整理後的 LINE Rangers 遊戲資料查詢介面。你可以快速查詢能力效果、觸發條件與相關數值，
        未來也會陸續加入更多資料分類。
      </p>
      <div class="hero-actions">
        <a class="primary-btn" href="./ability/">前往能力查詢</a>
      </div>
    </section>

    <section class="tool-grid">
      <a class="tool-card" href="./ability/">
        <div class="tool-icon">能力</div>
        <div>
          <h2>能力數值查詢</h2>
          <p>查詢能力名稱、敘述、覺醒狀態、觸發時機、條件與效果。</p>
        </div>
      </a>

      <div class="tool-card disabled">
        <div class="tool-icon">角色</div>
        <div>
          <h2>角色資料查詢</h2>
          <p>預留區塊，之後可新增角色、裝備、技能或轉蛋資料查詢。</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./assets/js/site.js"></script>
</body>
</html>
