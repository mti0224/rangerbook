<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINE Rangers Database</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var hasRepoPrefix = path.indexOf('/rangerbook/') === 0;
      var root = hasRepoPrefix ? '/rangerbook/' : '/';
      var isGearDetail = /^(?:\/rangerbook)?\/gear\/[^/]+\/?$/.test(path);
      var isEndlessStage = /^(?:\/rangerbook)?\/endless\/stage\/end\d+\/?$/i.test(path);
      var isHsStage = /^(?:\/rangerbook)?\/hs\/stage\/hs\d+\/?$/i.test(path);
      var hardMatch = path.match(/^(?:\/rangerbook)?\/mainstage\/hard\/stage\/hs(\d+)\/?$/i);
      var extremeMatch = path.match(/^(?:\/rangerbook)?\/mainstage\/extreme\/stage\/es(\d+)\/?$/i);

      if (isGearDetail) {
        var match = path.match(/\/gear\/([^/]+)\/?$/);
        var gearId = match ? match[1] : '';
        try { gearId = decodeURIComponent(gearId); } catch (error) {}
        window.location.replace(root + 'gear/?detail=' + encodeURIComponent(gearId));
        return;
      }

      window.__rangerbookRoot = root;
      window.__mainstageStageMode = hardMatch ? 'hard' : extremeMatch ? 'extreme' : '';
      window.__mainstageStageNo = Number((hardMatch && hardMatch[1]) || (extremeMatch && extremeMatch[1]) || 0);
      window.__rangerbookRouteKind = hardMatch
        ? 'mainstage-hard-stage'
        : extremeMatch
          ? 'mainstage-extreme-stage'
          : isHsStage
            ? 'hs-stage'
            : isEndlessStage
              ? 'endless-stage'
              : 'unknown';

      ['style.css','ranger.css','ranger-ability-effect-merge.css','hsEnemy.css','card-tag-colors.css','endless.css','hs-stage.css'].forEach(function (file) {
        document.write('<link rel="stylesheet" href="' + root + 'assets/css/' + file + '">');
      });
    })();
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main id="endlessRoute" class="page ranger-page" hidden>
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>無限之塔關卡資訊</h1>
      <p>選擇樓層後查看該樓層的敵人生產線資訊。</p>
    </section>
    <section id="endlessStageGrid" class="endless-stage-grid" aria-label="無限之塔樓層選擇"></section>
    <section id="endlessStageDetail" hidden>
      <div class="endless-stage-head">
        <h2 id="endlessStageTitle" class="endless-stage-title"></h2>
        <a id="endlessStageBackLink" class="endless-back-link" href="/endless/stage/">返回關卡選擇</a>
      </div>
      <div id="endlessStageTable"></div>
    </section>
  </main>

  <main id="hsRoute" class="page ranger-page" hidden>
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1 id="hsRouteHeading">困難關卡資訊</h1>
      <p id="hsRouteDescription">選擇關卡後查看該關卡的敵人生產線資訊。</p>
    </section>
    <section id="hsStageGrid" class="endless-stage-grid" aria-label="主要關卡選擇"></section>
    <section id="hsStageDetail" hidden>
      <div class="endless-stage-head">
        <h2 id="hsStageTitle" class="endless-stage-title"></h2>
        <a id="hsStageBackLink" class="endless-back-link" href="/mainstage/hard/stage/">返回關卡選擇</a>
      </div>
      <div id="hsStageConditions"></div>
    </section>
  </main>

  <main id="unknownRoute" class="page ranger-page" hidden>
    <section class="page-title">
      <p class="eyebrow">LINE Rangers Database</p>
      <h1>找不到頁面</h1>
      <p>這個網址目前沒有對應的資料頁面。</p>
    </section>
  </main>

  <div id="endlessEnemyModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="endlessEnemyModalTitle">
      <button id="endlessEnemyModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="endlessEnemyModalContent"></div>
    </div>
  </div>

  <div id="hsEnemyLineModal" class="modal-backdrop" hidden>
    <div class="modal-panel ranger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="hsEnemyLineModalTitle">
      <button id="hsEnemyLineModalCloseBtn" class="modal-close" type="button" aria-label="關閉敵人詳細資料">×</button>
      <div id="hsEnemyLineModalContent"></div>
    </div>
  </div>

  <script>
    (function () {
      var root = window.__rangerbookRoot || '/';
      var kind = window.__rangerbookRouteKind || 'unknown';
      var endlessRoute = document.getElementById('endlessRoute');
      var hsRoute = document.getElementById('hsRoute');
      var unknownRoute = document.getElementById('unknownRoute');

      if (kind === 'endless-stage') endlessRoute.hidden = false;
      else if (kind === 'hs-stage' || kind === 'mainstage-hard-stage' || kind === 'mainstage-extreme-stage') hsRoute.hidden = false;
      else unknownRoute.hidden = false;

      if (kind === 'mainstage-extreme-stage') {
        document.getElementById('hsRouteHeading').textContent = '極限模式關卡資訊';
      }

      var endlessBackLink = document.getElementById('endlessStageBackLink');
      if (endlessBackLink) endlessBackLink.href = root + 'endless/stage/';
      var hsBackLink = document.getElementById('hsStageBackLink');
      if (hsBackLink) {
        hsBackLink.href = kind === 'mainstage-extreme-stage'
          ? root + 'mainstage/extreme/stage/'
          : kind === 'mainstage-hard-stage'
            ? root + 'mainstage/hard/stage/'
            : root + 'hs/stage/';
      }

      document.write('<script src="' + root + 'assets/js/site.js"><\/script>');
      if (kind === 'endless-stage') {
        document.write('<script src="' + root + 'assets/js/endless-stage.js"><\/script>');
      } else if (kind === 'hs-stage') {
        document.write('<script src="' + root + 'assets/js/hs-stage.js"><\/script>');
      } else if (kind === 'mainstage-hard-stage' || kind === 'mainstage-extreme-stage') {
        document.write('<script src="' + root + 'assets/js/mainstage-stage-adapter.js"><\/script>');
        document.write('<script src="' + root + 'assets/js/hs-stage.js"><\/script>');
      }
      document.write('<script src="' + root + 'assets/js/card-tag-colors.js"><\/script>');
    })();
  </script>
</body>
</html>
